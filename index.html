<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Epitaph</title>
<!-- 本文書体は DADS 指定の Noto Sans JP（読めなければ端末の和文ゴシックで表示） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<!-- 唯一の外部スクリプト。実約定記録のPATを localStorage に置くため、
     SRIで改ざんを遮断する（ハッシュ不一致なら読み込まれずチャートのみ欠ける） -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
        integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4"
        crossorigin="anonymous"></script>
<style>
  /* ==== デジタル庁デザインシステム（DADS）準拠のトークン ====
     値は @digital-go-jp/design-tokens 2.1.0（MIT）の primitive から取る。
     DADS は暗色テーマを定義していないため、暗色は同じ primitive の明るい段で組む。
     文字色は全て背景に対して 4.5:1 以上（本文・注記とも）。2026-10-26 改訂 */
  :root {
    color-scheme: light dark;
    --bg: #f2f2f2;            /* solid-gray-50 */
    --surface: #ffffff;       /* white */
    --surface2: #f2f2f2;      /* solid-gray-50 */
    --ink: #1a1a1a;           /* solid-gray-900 */
    --muted: #4d4d4d;         /* solid-gray-700 */
    --faint: #666666;         /* solid-gray-600（白地 5.7:1） */
    --line: #cccccc;          /* solid-gray-200 */
    --line-strong: #767676;   /* solid-gray-536（入力欄の枠・3:1） */
    --accent: #0017c1;        /* blue-900（DADS のキーカラー） */
    --accent-hover: #00118f;  /* blue-1000 */
    --accent-soft: #e8f1fe;   /* blue-50 */
    --pos: #197a4b;           /* green-800（success-2） */
    --neg: #ce0000;           /* red-900（error-2） */
    --warn: #ac3e00;          /* orange-900 */
    --pos-soft: #e6f5ec;      /* green-50 */
    --neg-soft: #fdeeee;      /* red-50 */
    --warn-soft: #ffeee2;     /* orange-50 */
    --ring-track: #e6e6e6;    /* solid-gray-100 */
    --focus: #ffd43d;         /* yellow-300（フォーカスリング） */
    --radius: 12px;           /* border-radius-12 */
    --radius-s: 8px;          /* border-radius-8 */
    /* 旧テーマの名前（描画コードが参照している）を新トークンへ寄せる */
    --glass: var(--surface); --glass-strong: var(--surface2);
    --stroke: var(--line); --stroke2: var(--line); --accent2: var(--accent);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --surface: #1e1e1e; --surface2: #2a2a2a;
      --ink: #f2f2f2;           /* solid-gray-50 */
      --muted: #cccccc;         /* solid-gray-200 */
      --faint: #b3b3b3;         /* solid-gray-300（#1e1e1e 上 8.4:1） */
      --line: #4d4d4d; --line-strong: #949494;
      --accent: #9db7f9;        /* blue-300 */
      --accent-hover: #c5d7fb;  /* blue-200 */
      --accent-soft: rgba(157,183,249,.14);
      --pos: #71c598;           /* green-300 */
      --neg: #ff9696;           /* red-300 */
      --warn: #ffa66d;          /* orange-300 */
      --pos-soft: rgba(113,197,152,.14); --neg-soft: rgba(255,150,150,.13);
      --warn-soft: rgba(255,166,109,.13);
      --ring-track: #333333;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    font-size: 16px; line-height: 1.7; letter-spacing: .02em;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    overflow-x: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  a { color: var(--accent); }
  code { font-family: "Noto Sans Mono", ui-monospace, Menlo, Consolas, monospace;
         font-size: .9em; background: var(--surface2); padding: 0 4px; border-radius: 4px;
         overflow-wrap: anywhere; }
  /* DADS のフォーカス表示: 黒の外枠＋黄色のリング（キーボード操作時だけ） */
  :focus-visible { outline: 4px solid #000; outline-offset: 2px;
                   box-shadow: 0 0 0 2px var(--focus); border-radius: 4px; }
  @media (prefers-color-scheme: dark) { :focus-visible { outline-color: var(--focus); box-shadow: none; } }

  /* 旧テーマの背景装飾は使わない（読み取りの邪魔になる動く背景をやめる） */
  #bg { display: none; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation-duration: .001s !important; }
  }

  /* ---- パネル共通（旧 .glass。名前は残し、平らな面＋1px の枠にする） ---- */
  .glass {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); position: relative; overflow: hidden;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 64px; }

  .acq-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .pos-list { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
  .pos-list .pos-card { margin-bottom: 0; }
  .grid2 > .card { margin-bottom: 0; }

  /* ---- パスワードゲート ---- */
  #gate { min-height: 92vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .gate-card { width: min(420px, 100%); padding: 40px 28px 32px; text-align: center;
               transition: opacity .3s; }
  .gate-card.away { opacity: 0; }
  .lock-orb { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    background: var(--accent-soft); }
  .gate-card h1 { font-size: 24px; letter-spacing: .12em; font-weight: 700; }
  .gate-card .sub { color: var(--muted); font-size: 16px; margin: 8px 0 24px; }
  .gate-card input {
    width: 100%; min-height: 56px; padding: 12px 16px; font-size: 16px;
    border-radius: var(--radius-s); border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink); text-align: center; letter-spacing: .1em; }
  .gate-card button, .rf-send {
    width: 100%; margin-top: 16px; min-height: 56px; padding: 12px 16px; font-size: 16px;
    font-weight: 700; border: none; border-radius: var(--radius-s); color: #fff; cursor: pointer;
    background: #0017c1; }
  .gate-card button:hover, .rf-send:hover { background: #00118f; text-decoration: underline; }
  .err { color: var(--neg); font-size: 14px; min-height: 22px; margin-top: 12px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px);} 40%,80% { transform: translateX(8px);} }

  /* ---- アプリ ---- */
  #app { display: none; opacity: 0; transition: opacity .4s; }
  #app.in { opacity: 1; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px;
         padding: 4px 0 16px; flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: .2em; font-size: 18px; }
  .top-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .asof { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--pos); }
  .btn-sub { min-height: 40px; padding: 6px 14px; border-radius: var(--radius-s);
             border: 1px solid var(--accent); background: var(--surface); color: var(--accent);
             font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-sub:hover { background: var(--accent-soft); text-decoration: underline; }

  /* 見出し（DADS の見出しは左の色帯でなく、太さと大きさで階層を示す） */
  .sec { font-size: 20px; font-weight: 700; line-height: 1.5; margin: 32px 0 6px; }
  .sec:first-of-type { margin-top: 8px; }
  .sec-desc { font-size: 14px; color: var(--muted); margin: 0 0 14px; }
  .sec-label { font-size: 14px; color: var(--muted); font-weight: 700; margin: 24px 0 10px; }

  .hero { padding: 24px 20px; text-align: center; margin-bottom: 16px; }
  .hero .label { font-size: 14px; color: var(--muted); }
  .hero .big { font-size: clamp(34px, 9vw, 48px); font-weight: 700; line-height: 1.2;
               margin: 6px 0 2px; overflow-wrap: anywhere; }
  .hero .big.pos { color: var(--pos); } .hero .big.neg { color: var(--neg); }
  .hero .split { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  /* チップはピル内で途中改行させない（「…2,399,100 / 円」と千切れて崩れた実例あり） */
  .chip { padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 700;
          background: var(--surface2); border: 1px solid var(--line);
          color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--ink); }
  .chip.pos b { color: var(--pos); } .chip.neg b { color: var(--neg); }
  .ath-badge { display: none; margin: 10px auto 0; width: fit-content; padding: 4px 14px;
    border-radius: 999px; font-size: 14px; font-weight: 700; color: #604b00; background: #fff0b3; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 600px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .tile { padding: 16px 12px; text-align: center; }
  .tile .t-label { font-size: 14px; color: var(--muted); }
  .tile .t-val { font-size: 24px; font-weight: 700; margin-top: 2px; line-height: 1.3;
                 overflow-wrap: anywhere; }
  .tile .t-sub { font-size: 13px; color: var(--faint); margin-top: 4px; line-height: 1.5; }

  .card { padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 18px; color: var(--ink); font-weight: 700; line-height: 1.5;
             margin-bottom: 12px; display: flex; align-items: flex-start; gap: 8px;
             flex-wrap: wrap; }
  .card h2 .em { font-size: 18px; }
  @media (max-width: 600px) { .card { padding: 16px; } }

  /* 目標リング */
  .ring-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .ring-box { position: relative; width: 116px; height: 116px; flex: none; }
  .ring-box svg { transform: rotate(-90deg); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; }
  .ring-center .pct { font-size: 22px; font-weight: 700; }
  .ring-center .cap { font-size: 12px; color: var(--faint); }
  .ring-info .line1 { font-size: 18px; font-weight: 700; }
  .ring-info .line2 { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .ring-info .line3 { font-size: 14px; margin-top: 6px; font-weight: 700; }

  .streak-face { font-size: 36px; line-height: 1; }
  .streak-num { font-size: 24px; font-weight: 700; margin-top: 6px; }
  .streak-cap { font-size: 14px; color: var(--muted); margin-top: 4px; }

  .rec-row { display: flex; justify-content: space-between; align-items: center; gap: 12px;
             padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .rec-row:last-child { border-bottom: none; }
  .rec-row .who { color: var(--muted); overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; min-width: 0; flex: 1; text-align: right; }
  .rec-row b { white-space: nowrap; }

  .chart-box { position: relative; height: 220px; }
  .chart-note { font-size: 14px; color: var(--muted); margin-top: 10px; line-height: 1.7; }
  .muted { color: var(--faint); }

  /* 表: 横に収まらないときは表だけを横スクロールさせる（ページを横に揺らさない） */
  .tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 15px; }
  .mini-table th { text-align: left; color: var(--muted); font-weight: 700; font-size: 14px;
    padding: 6px 8px; border-bottom: 2px solid var(--line); white-space: nowrap; }
  .mini-table td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .mini-table td.num, .mini-table td .num { white-space: nowrap; }
  .mini-table tr:last-child td { border-bottom: none; }
  @media (min-width: 601px) { .mini-table td:first-child { min-width: 7em; } }
  @media (max-width: 600px) { .mini-table th, .mini-table td { padding: 8px 5px; font-size: 14px; } }
  .mini-table td .muted { font-weight: 400; }

  /* エントリーパターン表 */
  .ep-filters { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .ep-filters select, .pos-tools select { min-height: 44px; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 6px 10px; font-size: 15px;
    max-width: 100%; }
  .ep-wrap { overflow-x:auto; max-height:460px; overflow-y:auto; margin-top:6px;
             border: 1px solid var(--line); border-radius: var(--radius-s); }
  .ep-table thead th { position:sticky; top:0; background: var(--surface2); user-select:none; }
  .ep-table td { white-space:nowrap; }
  .ep-live { color: var(--neg); font-weight:700; }
  .ep-paper { color:var(--muted); }
  .ep-miss { color: var(--neg); }
  .ep-suspect { color: var(--warn); cursor:help; }
  .ep-healed { color: var(--pos); cursor:help; }

  .strat-unfilled { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);
    font-size:14px; color:var(--muted); line-height:1.6; }
  /* 戦略別 期待値 vs 実績 */
  .strat { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .strat:last-child { border-bottom: none; padding-bottom: 2px; }
  .strat-head { display: flex; align-items: center; gap: 8px; }
  .strat-name { font-weight: 700; font-size: 16px; flex: 1; min-width: 0;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strat-real { font-size: 16px; font-weight: 700; white-space: nowrap; }
  .strat-real.muted { color: var(--faint); font-weight: 400; font-size: 14px; }
  .strat-sub { margin: 8px 0 12px; }
  .strat-chip { font-size: 13px; padding: 4px 12px; border-radius: 999px; font-weight: 700;
                background: var(--surface2); border: 1px solid var(--line);
                color: var(--muted); display: inline-flex; align-items: baseline; gap: 8px;
                white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .strat-chip.muted { font-weight: 400; color: var(--faint); white-space: normal; }
  .strat-chip .chip-sub { font-size: 12px; color: var(--faint); font-weight: 700; }
  .strat-grid { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 6px 16px;
                align-items: center; }
  .sg-h { font-size: 12px; color: var(--faint); text-align: right; white-space: nowrap; }
  .sg-h span { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 4px;
               background: var(--ring-track); font-size: 11px; }
  .sg-l { font-size: 14px; color: var(--muted); }
  .sg-e, .sg-a { text-align: right; font-size: 15px; font-weight: 700;
                 font-variant-numeric: tabular-nums; min-width: 48px; }
  .sg-e { color: var(--muted); }
  .sg-a.muted { color: var(--faint); font-weight: 400; }
  .strat-guide { flex: none; width: 32px; height: 32px; border-radius: 50%;
                 border: 1px solid var(--line-strong); background: var(--surface);
                 color: var(--accent); font-size: 15px; line-height: 1; cursor: pointer;
                 padding: 0; display: inline-flex; align-items: center; justify-content: center; }

  /* 鮮度・警告・moon */
  .stale-banner { background: var(--neg-soft); border: 2px solid var(--neg);
    color: var(--ink); padding: 14px 16px; border-radius: var(--radius-s); font-size: 15px;
    font-weight: 700; line-height: 1.7; margin-bottom: 16px; }
  .status-ok { font-size: 14px; color: var(--muted); margin: 2px 0 14px; line-height: 1.7; }
  .status-ok strong { color: var(--ink); }
  .warn-card { border: 2px solid var(--warn) !important; }
  .warn-sum { font-size: 15px; color: var(--muted); margin: -4px 0 8px; }
  .warn-item { font-size: 15px; color: var(--ink); padding: 10px 0 10px 12px; line-height: 1.75;
    border-bottom: 1px solid var(--line); border-left: 4px solid var(--line); margin-left: -4px;
    overflow-wrap: anywhere; }
  .warn-item.lv-high { border-left-color: var(--neg); }
  .warn-item.lv-mid { border-left-color: var(--warn); }
  .warn-item.lv-info { border-left-color: var(--line-strong); color: var(--muted); }
  .warn-item:last-child { border-bottom: none; }
  .warn-more summary { font-size: 15px; font-weight: 700; color: var(--accent); cursor: pointer;
    padding: 10px 0; min-height: 44px; }
  .moon-card { border-color: #8843e1 !important; }
  .moon-thesis { font-size: 15px; color: var(--muted); line-height: 1.75; margin: 8px 0 10px; }

  /* 折りたたみ（詳細セクション）: DADS のアコーディオンに合わせ、見出しを押して開く */
  .fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
          margin-bottom: 12px; overflow: hidden; }
  .fold > summary { list-style: none; cursor: pointer; padding: 14px 48px 14px 16px;
          font-size: 16px; font-weight: 700; position: relative; min-height: 52px; line-height: 1.5; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::after { content: ""; position: absolute; right: 20px; top: 50%;
          width: 10px; height: 10px; border-right: 2px solid var(--accent);
          border-bottom: 2px solid var(--accent); transform: translateY(-70%) rotate(45deg);
          transition: transform .2s; }
  .fold[open] > summary::after { transform: translateY(-30%) rotate(-135deg); }
  .fold > summary:hover { background: var(--accent-soft); }
  .fold .fold-sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .fold > .card { border: none; border-top: 1px solid var(--line); border-radius: 0; margin: 0; }
  .fold > .card > h2 { display: none; }
  .fold > .pos-list, .fold > .chart-note { padding: 0 16px 16px; }

  /* 投資法ガイド: ヘッダのボタン＋モーダル */
  #guideFab { display: none !important; }
  #guide { position: fixed; inset: 0; z-index: 50; display: none; }
  #guide.show { display: block; }
  .guide-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
  .guide-panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh;
                 border-radius: var(--radius) var(--radius) 0 0; padding: 8px 16px 24px;
                 display: flex; flex-direction: column; }
  @media (min-width: 620px) {
    .guide-panel { left: 50%; right: auto; bottom: auto; top: 50%; width: 600px; max-height: 84vh;
                   border-radius: var(--radius); transform: translate(-50%, -50%); }
  }
  .guide-top { display: flex; align-items: center; justify-content: space-between;
               padding: 10px 4px 8px; position: sticky; top: 0; background: var(--surface); }
  .guide-top h2 { font-size: 20px; font-weight: 700; }
  #guideClose { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-strong);
                background: var(--surface); color: var(--ink); font-size: 16px; cursor: pointer; }
  .guide-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 6px; }
  .guide-intro { font-size: 14px; color: var(--muted); line-height: 1.75; margin-bottom: 12px;
                 padding: 12px; border-radius: var(--radius-s); background: var(--surface2); }
  .g-item { border: 1px solid var(--line); border-radius: var(--radius-s); margin-bottom: 10px;
            overflow: hidden; background: var(--surface); }
  .g-head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 14px;
            min-height: 52px; background: none; border: none; cursor: pointer; text-align: left;
            color: var(--ink); font: inherit; }
  .g-name { font-weight: 700; font-size: 16px; flex: 1; }
  .g-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .g-badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 700;
             color: var(--muted); background: var(--surface2); border: 1px solid var(--line);
             white-space: nowrap; }
  .g-badge.bt-y { color: var(--pos); } .g-badge.bt-n { color: var(--faint); }
  .g-caret { color: var(--accent); font-size: 14px; transition: transform .25s; }
  .g-item.open .g-caret { transform: rotate(180deg); }
  .g-panel { max-height: 0; overflow: hidden; transition: max-height .35s ease; padding: 0 14px; }
  .g-item.open .g-panel { max-height: 900px; padding: 2px 14px 14px; }
  .g-tag { font-size: 15px; font-weight: 700; color: var(--accent); line-height: 1.7; margin: 4px 0 10px; }
  .g-row, .g-risk { display: grid; grid-template-columns: 76px 1fr; gap: 10px;
                    padding: 8px 0; border-top: 1px solid var(--line); }
  .g-h { font-size: 13px; color: var(--muted); font-weight: 700; padding-top: 2px; }
  .g-t { font-size: 15px; color: var(--ink); line-height: 1.75; }
  .g-risk .g-h { color: var(--neg); }

  /* ポジションカード */
  .pos-card { padding: 16px; margin-bottom: 12px; }
  .pos-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .pos-name { font-weight: 700; font-size: 17px; min-width: 0; line-height: 1.5; }
  .pos-code { color: var(--faint); font-size: 14px; margin-left: 6px; font-weight: 400; }
  .pos-name .tag { margin-left: 6px; vertical-align: 2px; }
  .ext-link { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .ext-link:hover { color: var(--accent-hover); text-decoration-thickness: 2px; }
  .pos-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  .pchip { min-height: 40px; background: var(--surface); color: var(--accent);
      border: 1px solid var(--accent); border-radius: 999px; padding: 6px 14px; font-size: 14px;
      font-weight: 700; cursor: pointer; }
  .pchip.on { color: #fff; background: #0017c1; border-color: #0017c1; }
  @media (prefers-color-scheme: dark) { .pchip.on { color: #1a1a1a; background: var(--accent); border-color: var(--accent); } }
  .eta-line { font-size: 15px; margin: 10px 2px 0; }
  .eta-sub { font-size: 13px; color: var(--faint); }
  .pos-pnl { font-size: 22px; font-weight: 700; white-space: nowrap; }
  .pos-meta { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
  .tag { font-size: 13px; padding: 2px 10px; border-radius: 999px; font-weight: 700;
         background: var(--surface2); border: 1px solid var(--line);
         color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
         white-space: nowrap; line-height: 1.6; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .hp { position: relative; height: 10px; border-radius: 999px; background: var(--ring-track); }
  .hp-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent);
             transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .hp-cursor { position: absolute; top: -3px; width: 4px; height: 16px; border-radius: 2px;
               background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
  .hp-labels { display: flex; justify-content: space-between; font-size: 13px; gap: 8px;
               color: var(--faint); margin-top: 8px; flex-wrap: wrap; }
  .pos-nums { display: flex; justify-content: space-between; font-size: 14px;
              color: var(--muted); margin-top: 10px; flex-wrap: wrap; gap: 4px 12px; }

  /* トレード行 */
  .trade { display: flex; align-items: center; gap: 12px; padding: 12px 0;
           border-bottom: 1px solid var(--line); font-size: 15px; }
  .trade:last-child { border-bottom: none; }
  .w-orb { width: 36px; height: 36px; border-radius: var(--radius-s); flex: none; display: flex;
           align-items: center; justify-content: center; font-size: 15px; font-weight: 700; }
  .w-orb.win { background: var(--pos-soft); color: var(--pos); }
  .w-orb.loss { background: var(--neg-soft); color: var(--neg); }
  .trade .mid { flex: 1; min-width: 0; }
  .trade .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trade .dt { font-size: 13px; color: var(--faint); }
  .trade .amt { text-align: right; font-weight: 700; white-space: nowrap; }
  .trade .amt .p { font-size: 13px; font-weight: 400; color: var(--faint); display: block; }

  /* Bull/Bear */
  .duel { border-radius: var(--radius-s); border: 1px solid var(--line); padding: 14px;
          margin-bottom: 12px; background: var(--surface); }
  .duel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
               margin-bottom: 10px; font-size: 16px; font-weight: 700; }
  .verdict { font-size: 13px; padding: 2px 10px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .v-proceed { background: var(--pos-soft); color: var(--pos); }
  .v-reduce { background: var(--warn-soft); color: var(--warn); }
  .v-veto { background: var(--neg-soft); color: var(--neg); }
  .duel-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 600px) { .duel-body { grid-template-columns: 1fr; } }
  .side { border-radius: var(--radius-s); padding: 10px 12px; font-size: 14px; line-height: 1.75; }
  .side.bull { background: var(--pos-soft); }
  .side.bear { background: var(--neg-soft); }
  .side .s-tag { font-size: 13px; font-weight: 700; }
  .side.bull .s-tag { color: var(--pos); } .side.bear .s-tag { color: var(--neg); }
  .duel-outcome { margin-top: 10px; font-size: 15px; font-weight: 700; }

  /* 較正バー。リスト全体を1つの grid にして max-content で全行の列幅を共有する
     （.cal-row は display:contents で行のまとまりだけ残す） */
  .cal-list { display: grid; align-items: center; font-size: 15px;
              grid-template-columns: max-content minmax(48px, 1fr) max-content;
              column-gap: 12px; row-gap: 12px; }
  .cal-row { display: contents; }
  .cal-lbl { word-break: keep-all; overflow-wrap: normal; }
  .cal-bar { height: 12px; border-radius: 999px; background: var(--ring-track);
             overflow: hidden; min-width: 0; }
  .cal-fill { height: 100%; border-radius: 999px; background: var(--accent);
              transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .cal-side { text-align: right; color: var(--muted); white-space: nowrap; }

  /* NISAゲージ */
  .nisa-lbl { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .nisa-bar { height: 14px; border-radius: 999px; background: var(--ring-track); overflow: hidden; }
  .nisa-fill { height: 100%; border-radius: 999px; background: var(--pos); width: 0;
               transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .nisa-cap { display: flex; justify-content: space-between; font-size: 14px; gap: 8px;
              color: var(--muted); margin-top: 8px; flex-wrap: wrap; }

  /* 📲 実約定の記録フォーム（DADS のフォーム: ラベルは上・入力欄は高さ 48px 以上） */
  .rf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .rf-grid { grid-template-columns: 1fr; } }
  .rf-lbl { display: flex; flex-direction: column; gap: 6px; font-size: 15px;
            color: var(--ink); font-weight: 700; min-width: 0; }
  .rf-lbl.wide { grid-column: 1 / -1; }
  .rf-in { min-height: 48px; padding: 10px 12px; font-size: 16px; border-radius: var(--radius-s);
           border: 1px solid var(--line-strong); background: var(--surface);
           color: var(--ink); width: 100%; font-weight: 400; }
  .rf-send:disabled { opacity: .55; cursor: default; text-decoration: none; }
  .rf-msg { font-size: 15px; margin-top: 10px; min-height: 18px; line-height: 1.7; }
  .rf-msg.ok { color: var(--pos); font-weight: 700; }
  .rf-msg.err { color: var(--neg); font-weight: 700; }
  .rf-token { margin-bottom: 12px; font-size: 14px; color: var(--muted); line-height: 1.75; }
  .rf-tok-setup { display: flex; flex-direction: column; gap: 8px; padding: 12px;
                  border-radius: var(--radius-s); background: var(--surface2);
                  border: 1px dashed var(--line-strong); }
  .rf-tok-ok { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rf-tok-btn { min-height: 40px; padding: 6px 14px; border-radius: var(--radius-s);
                border: 1px solid var(--accent); background: var(--surface); color: var(--accent);
                font-size: 14px; font-weight: 700; cursor: pointer; width: fit-content; }

  /* ウォームアップ */
  .warm { text-align: center; padding: 40px 24px; }
  .warm .orbit { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid var(--ring-track); border-top-color: var(--accent);
    animation: spin 2.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .warm h3 { font-size: 18px; margin-bottom: 8px; }
  .warm p { font-size: 15px; color: var(--muted); line-height: 1.8; }

  .foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 32px; line-height: 1.8; }
  .pos-c { color: var(--pos); } .neg-c { color: var(--neg); }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

  /* ---- PC最適化（広い画面では幅を広げてカード類を2カラム化）。
       ※ このブロックはCSSの最後に置くこと — メディアクエリは詳細度を
         上げないため、後方の基本定義に上書きされる（実際に起きた） ---- */
  @media (min-width: 1100px) {
    .wrap { max-width: 1200px; padding: 24px 32px 80px; }
    .pos-list { grid-template-columns: 1fr 1fr; }
    .strat-wrap { display: grid; grid-template-columns: 1fr 1fr; column-gap: 36px; }
    .strat-wrap .strat:nth-last-child(-n+2) { border-bottom: none; }
    .rf-grid { grid-template-columns: repeat(4, 1fr); }
    .rf-send { width: auto; min-width: 280px; }
    .chart-box { height: 250px; }
  }
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="confetti"></canvas>

<div id="gate">
  <div class="gate-card glass" id="gateCard">
    <div class="lock-orb">🔐</div>
    <h1>EPITAPH</h1>
    <div class="sub">プライベート運用ダッシュボード<br>閲覧パスワードを入力してください</div>
    <input id="pw" type="password" placeholder="••••••••" autofocus
           autocomplete="current-password">
    <button id="unlock">ロック解除</button>
    <div id="err" class="err"></div>
  </div>
</div>

<div id="app" class="wrap"></div>

<!-- 投資法ガイド: 常設の小ボタン→タップで開くモーダル（常時表示はしない） -->
<button id="guideFab" aria-label="投資法ガイドを開く" title="投資法ガイド">📖</button>
<div id="guide" role="dialog" aria-modal="true" aria-label="投資法ガイド">
  <div class="guide-scrim"></div>
  <div class="guide-panel glass">
    <div class="guide-top">
      <h2>📖 投資法ガイド</h2>
      <button id="guideClose" aria-label="閉じる">✕</button>
    </div>
    <div class="guide-body" id="guideBody"></div>
  </div>
</div>

/* ---------- 復号 (AES-256-GCM + PBKDF2-HMAC-SHA256) ---------- */
function b64ToBytes(b64) {
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function decrypt(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(ENC.salt), iterations: ENC.iterations, hash: "SHA-256" },
    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(ENC.iv) }, key, b64ToBytes(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

const fmt = (n) => Math.round(Number(n)).toLocaleString("ja-JP");
/* 負号はASCIIの "-" を使う。U+2212 は日本語フォントで長音「ー」と
   見分けがつかない（-123,456円 が ー123,456円 に見える）ため */
const yen = (n) => (n >= 0 ? "+" : "-") + fmt(Math.abs(n)) + "円";
const cls = (n) => (n >= 0 ? "pos" : "neg");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* 警告文などの **太字** を表示する（先にエスケープしてから置換するので HTML は入らない）。
   2026-10-26 まで「**投資額の上限**」が記号のまま画面に出ていた */

function countUp(el, target, dur) {
  if (reduceMotion || Math.abs(target) < 1) {
    el.textContent = yen(target); return;
  }
  const t0 = performance.now();
  (function tick(t) {
    const p = Math.min((t - t0) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = yen(target * ease);
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

function ringSVG(pct, size, stroke, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const off = c * (1 - Math.min(Math.max(pct, 0), 1));
  return `<svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
      stroke="var(--ring-track)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
      stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${reduceMotion ? off : c}"
      style="transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)"
      data-off="${off}"/>
  </svg>`;
}

/* ---------- 紙吹雪 (最高益更新時のみ・reduced-motion時は無効) ---------- */
function confetti() {
  if (reduceMotion) return;
  const cv = document.getElementById("confetti");
  const ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#2E7FE8", "#D4569B", "#1F9D66", "#C07E1F", "#FFD666"];
  const parts = Array.from({ length: 130 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
    vy: 2.2 + Math.random() * 3, vx: -1.5 + Math.random() * 3,
    rot: Math.random() * Math.PI, vr: -.12 + Math.random() * .24,
    c: colors[(Math.random() * colors.length) | 0],
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
    }
    if (t - t0 < 2600) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

/* ---------- 描画 ---------- */

function wireEntryPatterns(d) {
  /* エントリーパターン表: フィルタ4軸＋列ソート＋要約行。全てクライアント側。 */
  const body = document.getElementById("epBody");
  if (!body) return;
  const rows = d.entry_patterns || [];
  let sortKey = "date", sortDir = -1;

  const num = (v) => (v === null || v === undefined || v === "") ? null : Number(v);
  const gap = (r) => {
    const o = num(r.open), l = num(r.limit);
    return (o !== null && l) ? (o - l) / l * 100 : null;
  };
  const fmt = (v) => v === null ? "—" : Math.round(v).toLocaleString();
  const pctf = (v) => v === null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(1) + "%";

  function current() {
    const st = document.getElementById("epStrategy").value;
    const tr = document.getElementById("epTrack").value;
    const lv = document.getElementById("epLive").value;
    const fl = document.getElementById("epFilled").value;
    return rows.filter(r =>
      (!st || r.strategy === st) &&
      (!tr || r.track === tr) &&
      (!lv || (lv === "live" ? r.live : !r.live)) &&
      (!fl || (fl === "filled" ? r.filled === true : r.filled === false)));
  }

  function paint() {
    const rs = current().slice();
    const key = sortKey;
    rs.sort((a, b) => {
      const va = key === "gap" ? gap(a) : a[key];
      const vb = key === "gap" ? gap(b) : b[key];
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir;
    });
    body.innerHTML = rs.map(r => `<tr>
      <td class="num">${esc(r.date || "")}</td>
      <td>${esc(r.code || "")} ${esc((r.name || "").slice(0, 8))}</td>
      <td>${esc((r.strategy || "—").replace("投資法", "").replace("投資", ""))}</td>
      <td>${r.live ? '<span class="ep-live">実弾</span>' : '<span class="ep-paper">紙</span>'}</td>
      <td class="num">${fmt(num(r.limit))} ${r.filled === true ? "✓" : r.filled === false ? '<span class="ep-miss">✗</span>' : ""}</td>
      <td class="num">${fmt(num(r.open))}</td>
      <td class="num">${fmt(num(r.close))}</td>
      <td class="num">${fmt(num(r.low))}</td>
      <td class="num">${r.entry_suspect ? '<span class="ep-miss" title="帳簿の建値が壊れている疑い — check_orders.bat で約定単価を確認し heal_entry_price で訂正">要確認</span>' : fmt(num(r.entry)) + (r.entry_healed ? ' <span class="ep-healed" title="運用者が約定通知の値で訂正済み">✔</span>' : '')}</td>
      <td class="num">${pctf(gap(r))}</td>
    </tr>`).join("") ||
      `<tr><td colspan="10" class="muted">条件に合う行がありません</td></tr>`;

    /* 要約: このフィルタ条件でのパターン差 */
    const known = rs.filter(r => r.filled === true || r.filled === false);
    const filled = known.filter(r => r.filled === true);
    const gaps = rs.map(gap).filter(v => v !== null);
    const cg = rs.map(r => {
      const c = num(r.close), l = num(r.limit);
      return (c !== null && l) ? (c - l) / l * 100 : null;
    }).filter(v => v !== null);
    const avg = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
    document.getElementById("epSummary").innerHTML =
      `${rs.length}件` +
      (known.length ? ` ・ 指値約定率 <b class="num">${Math.round(filled.length / known.length * 100)}%</b>（${filled.length}/${known.length}）` : "") +
      (gaps.length ? ` ・ 寄付きは指値より平均 <b class="num">${pctf(avg(gaps))}</b>（n=${gaps.length}）` : "") +
      (cg.length ? ` ・ 大引けは平均 <b class="num">${pctf(avg(cg))}</b>` : "") +
      ` ・ 寄付き/大引け欄は 2026-08-19 以降の記録のみ ・ ⚠=建値未検証 ✔=訂正済み`;
  }

  for (const id of ["epStrategy", "epTrack", "epLive", "epFilled"])
    document.getElementById(id).addEventListener("change", paint);
  document.querySelectorAll("#epTable thead th").forEach(th => {
    th.style.cursor = "pointer";
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = -1; }
      paint();
    });
  });
  paint();
}

function render(d) {
  const k = d.kpi;

  const app = document.getElementById("app");
  const hasData = d.positions.length || d.trades.length;

  /* 前回訪問との差分 (localStorage) */
  let visitDelta = null, newATH = false;
  try {
    const prev = JSON.parse(localStorage.getItem("epitaph_visit") || "null");
    if (prev && typeof prev.total === "number") visitDelta = total - prev.total;
    newATH = k.ath > 0 && prev && typeof prev.ath === "number" && k.ath > prev.ath;
    localStorage.setItem("epitaph_visit",
      JSON.stringify({ total, ath: k.ath, ts: Date.now() }));
  } catch (e) {}

  /* ── 判断セクションの部品（関数宣言は巻き上げされるため定義位置は自由） ── */

  function freshnessBanner() {
    /* ダッシュボード自身が「止まっている」ことを叫ぶ（表示層のfail-silent対策）。
       データ日が3日超前なら赤帯。週末を跨いでも金曜データは月曜まで正常扱い。 */
    if (!d.last_updated || d.last_updated === "—") return "";
    const dt = new Date(d.last_updated + "T15:00:00+09:00");
    if (isNaN(dt.getTime())) return "";
    const days = Math.floor((Date.now() - dt.getTime()) / 86400000);
    if (days <= 3) return "";
    return `<div class="stale-banner">⚠️ データが <b>${days}日前（${esc(d.last_updated)}）</b>から更新されていません
      — PC・タスクスケジューラ・同期の停止を確認してください</div>`;
  }

  function statusCard() {
    /* LINEを見逃した週にダッシュボードだけ健康な顔をしない: 日次バッチの
       システム警告を永続表示。「警告なし」と「状態不明」は区別する。 */
    const st = d.status || {};
    if (!st.available) {
      return `<div class="status-ok">🩺 システム警告: 状態ファイル未同期（判定不能 — 初回同期後に表示されます）</div>`;
    }
    const fn = (st.funnel && st.funnel.line)
      ? `<div class="status-ok">${mdBold(st.funnel.line).replace(/\n/g, "<br>")}</div>`
      : "";
    if (!st.warnings || !st.warnings.length) {
      return `<div class="status-ok">🩺 システム警告なし <span class="num">(${esc(st.date || "")})</span></div>` + fn;
    }
    /* 先頭の絵文字で重さを分ける（🚨🔴⛔=至急・⚠️=要確認・ℹ️=参考）。
       至急→要確認→参考の順に並べ、参考は折りたたむ（2026-10-26: 参考3件の下に
       実際に要対応の楽天RSS接続失敗が埋もれていた） */
    const lv = (w) => /^\s*(🚨|🔴|⛔)/.test(w) ? 0 : /^\s*ℹ/.test(w) ? 2 : 1;
    const LV_CLS = ["lv-high", "lv-mid", "lv-info"];
    const items = st.warnings.map((w, i) => ({ w, i, l: lv(w) }))
      .sort((a, b) => a.l - b.l || a.i - b.i);
    const nAct = items.filter(o => o.l < 2).length, nInfo = items.length - nAct;
    const item = (o) => `<div class="warn-item ${LV_CLS[o.l]}">${mdBold(o.w)}</div>`;
    let x = `<div class="card glass warn-card"><h2><span class="em">🚨</span>システム警告（${esc(st.date || "")}）</h2>
      <div class="warn-sum">確認が要るもの <b class="num">${nAct}</b>件・参考 <b class="num">${nInfo}</b>件</div>`;
    x += items.filter(o => o.l < 2).map(item).join("");
    if (nInfo) {
      x += `<details class="warn-more"${nAct ? "" : " open"}><summary>参考の警告 ${nInfo}件を表示</summary>
        ${items.filter(o => o.l === 2).map(item).join("")}</details>`;
    }
    /* **LINEへ届いたかは、この画面には分からない。** 送信の成否を測って
       いるのは大引けレポートのマーカー（close_report.json＝送信成功時のみ
       書かれる）だけなので、それを日付で出す。無条件に「送信済み」と書くと、
       通知経路が死んでいる日に**一番信用したい画面が嘘をつく**
       （2026-08-25〜29 の LINE 月間枠切れで4営業日そうなっていた）。 */
    const d0 = (d.line_delivery || {}).last_delivered;
    const lineNote = d0
      ? `LINEへ最後に届いた大引けレポートは <b>${esc(d0)}</b> 分です`
      : "LINEへの到達を確認できた記録がありません";
    x += `<div class="chart-note">この警告は解消されるまで毎日ここに表示されます。${lineNote}（LINEへの到達は保証されません — 休場日は日付が進みません）。</div></div>`;
    return x + fn;
  }

  function benchmarkCard() {
    /* §9（TOPIX超え）の途中経過 — ETF 1306 との月次比較（表示のみ・

    const b = d.benchmark_1306;
    if (!b || !(b.months || []).length) return "";
    const pct = (v) => v == null ? "—"
      : `<span class="num" style="color:${v >= 0 ? "var(--pos,#2e7d32)" : "var(--neg,#c62828)"}">${v >= 0 ? "+" : ""}${v.toFixed(2)}%</span>`;

      return `<tr><td style="white-space:nowrap">${esc(m.month)}${m.partial ? ' <span class="muted">(途中)</span>' : ""}</td>` +
        `<td>${pct(m.system_pct)}</td><td>${pct(m.etf_pct)}</td><td>${pct(diff)}</td></tr>`;
    }).join("");
    const cum = (b.cumulative_system_pct != null && b.cumulative_etf_pct != null)
      ? `蓄積開始からの累積: システム ${b.cumulative_system_pct >= 0 ? "+" : ""}${b.cumulative_system_pct}% / 1306 ${b.cumulative_etf_pct >= 0 ? "+" : ""}${b.cumulative_etf_pct}%（日次${b.nav_days}件）`

  /* ── 判断セクション（先頭）: 鮮度 → 警告 → 実弾（ブローカー別） → 戦略別 → AI寄与。

        <div class="moon-thesis">${esc(p.reason || "（仮説メモなし）")}</div>
        <div class="pos-nums num" style="color:var(--faint)">
          <span>取得 ${fmt(p.entry)}円 × ${fmt(p.shares)}株 = ${fmt(p.entry * p.shares)}円</span>
          <span>現在 ${fmt(p.current)}円</span>
        </div>
      </div>`;
    }
    h += `</div>`;
    h += `<div class="chart-note" style="margin:-4px 6px 14px">売る理由は「仮説の崩壊」のみ。
      下落そのものは売る理由になりません（月初のLINE点検で判断）。</div>`;
  }

  /* 保有ポジション（コア: 短期・長期） */
  if (corePos.length) {
    h += `<h3 class="sec-label">💼 保有ポジション <span class="num" style="font-weight:400">${corePos.length}件</span></h3>`;

    /* 並べ替え・絞り込み（運用者の要望 2026-08-12: 順不同で見づらい）。
       DOMの並び替えだけで実装（再描画しない＝壊れにくい） */
    h += `<div class="pos-tools">
      <select id="posSort" aria-label="並べ替え">
        <option value="dist">ストップまで近い順（要注意が上）</option>
        <option value="pnldesc">含み益が大きい順</option>
        <option value="pnlasc">含み損が大きい順</option>
        <option value="days">保有が長い順</option>
        <option value="code">コード順</option>
      </select>
      <button class="pchip on" data-pf="all">すべて</button>
      <button class="pchip" data-pf="short">短期</button>
      <button class="pchip" data-pf="long">長期</button>
      <button class="pchip" data-pf="loss">含み損のみ</button>
      <button class="pchip" data-pf="real">実買付のみ</button>
    </div>`;

    /* 🔴実弾 バッジが何を根拠にしているかを画面に書く（2026-08-23）。
       印は「発注が受け付けられた」時点で立ち、保有照会は見ていない。
       画面が区別できないことを黙っていると、運用者は「持っている」と
       読む。**機械が測っていないことは、測っていないと出す。** */
    h += `<div class="chart-note" style="margin:-4px 6px 12px">
      🔴実弾 は「システムが実弾経路で発注し、kabu が受け付けた」印です
      （失効すれば外れます）。<b>その時点で実際に保有していることの確認では
      ありません</b> — 指値が刺さっていない建玉にも立ちます。実保有は
      <code>scripts\\check_orders.bat</code>（約定数量 CumQty）で確認してください。</div>`;

    /* 取得合計・評価額合計（トラック別内訳つき）。長期は紙上建値ベース —
       実際に買った額は NISAパネルの「実買付済み額」（手動記録）が真実 */
    const acqOf = (arr) => arr.reduce((s, p) => s + p.entry * p.shares, 0);
    const valOf = (arr) => arr.reduce((s, p) => s + p.current * p.shares, 0);
    const acqAll = acqOf(d.positions), valAll = valOf(d.positions);
    const byTrack = ["short", "long", "moon"]
      .map(t => [t, acqOf(d.positions.filter(p => p.track === t))])
      .filter(([, v]) => v > 0)
      .map(([t, v]) => `<span class="chip">${TRACK_JA[t] || t} <b class="num">${fmt(v)}円</b></span>`)
      .join(" ");
    h += `<div class="card glass" style="padding:14px 18px">
      <div class="pos-nums num" style="margin-top:0">
        <span>取得合計 <b>${fmt(acqAll)}円</b></span>
        <span>評価額 <b>${fmt(valAll)}円</b></span>
        <span class="${cls(valAll - acqAll)}" style="color:var(--${cls(valAll - acqAll)});font-weight:700">${yen(valAll - acqAll)}</span>
      </div>
      <div class="acq-chips">${byTrack}</div>
      <div class="chart-note">長期は紙上建値ベースの合計。実際に買付済みの額は下のNISAパネル「実買付済み」を参照。</div>
    </div>`;
    h += `<div class="pos-list" id="posList">`;
    for (const p of corePos) {
      const sl = p.stop_loss, tp = p.take_profit;
      let hpHtml = "";
      if (sl && tp && tp > sl) {
        const cur = Math.min(Math.max((p.current - sl) / (tp - sl), 0), 1);
        const ent = Math.min(Math.max((p.entry - sl) / (tp - sl), 0), 1);
        hpHtml = `<div class="hp">
            <div class="hp-fill" style="width:0" data-w="${(cur*100).toFixed(1)}%"></div>
            <div class="hp-cursor" style="left:calc(${(ent*100).toFixed(1)}% - 2px);
                 opacity:.35" title="取得価格"></div>
          </div>
          <div class="hp-labels"><span>SL ${fmt(sl)}</span>
            <span>利確ライン ${fmt(tp)}</span></div>`;
      } else if (sl) {
        hpHtml = `<div class="hp-labels"><span>SL ${fmt(sl)}</span>
          <span>🚀 トレーリング中（利確上限なし）</span></div>`;
      }
      const conv = p.conviction != null
        ? `<span class="tag">AI確信度 <b class="num">${Math.round(p.conviction * 100)}%</b></span>` : "";
      // 長期は手動買付のため、実買付の有無を明示する（紙上のまま含み益を
      // 見せると「持っているつもり」になる。2026-08-01 運用者確認: 全て紙上）
      let manualTag = "";
      if (p.manual) {
        if (p.manual.state === "filled") {
          const div = p.manual.divergence_pct;
          manualTag = `<span class="tag" style="color:var(--pos)">実買付済
            ${div != null ? `<b class="num">乖離${div > 0 ? "+" : ""}${div}%</b>` : ""}</span>`;
        } else if (p.manual.state === "closed") {
          manualTag = `<span class="tag">実売却済</span>`;
        } else {
          manualTag = `<span class="tag" style="opacity:.75">紙上（未買付）</span>`;
        }
      }
      /* 実/紙の判定（運用者依頼 2026-08-18）:
         旧実装は track==="short" を無条件に「実」としていたが、実際に
         実弾なのは live_ordered が立った建玉だけ。
         短期15件中5件が実弾の日に、15件全部へ「実」を出していた。

         **live_ordered は「実保有と突合済み」の印ではない**（2026-08-23 に
         コメントを訂正）。src/main.py:742 が kabu の**発注受付**で立てる印で、
         保有照会を根拠にするのは src/fills.py の遡及復元だけ。印は2つの由来を
         区別して持たないので、この画面は「発注が通った」と「実際に持っている」
         を区別できない。区別できないことを画面に書く（下の注記）。 */
      const isReal = (p.track === "short" && p.live)
        || (p.manual && p.manual.state === "filled");
      let liveTag = "";
      if (p.track === "short") {
        liveTag = p.live
          ? `<span class="tag" style="color:var(--pos);font-weight:700">🔴 実弾</span>`
          : `<span class="tag" style="opacity:.75">紙上</span>`;
      }
      h += `<div class="pos-card glass" data-track="${esc(p.track)}"
        data-pnl="${Number(p.pnl_pct) || 0}" data-days="${p.days ?? 0}"
        data-dist="${p.stop_dist_pct ?? 999}" data-code="${esc(p.code)}"
        data-real="${isReal ? 1 : 0}">
        <div class="pos-head">
          <div class="pos-name">${esc(p.name)}<span class="pos-code num">${stockLink(p.code)}</span>${manualTag}${liveTag}</div>
          <div class="pos-pnl num ${cls(p.pnl_pct)}" style="color:var(--${cls(p.pnl_pct)})">
            ${p.pnl_pct >= 0 ? "+" : ""}${Number(p.pnl_pct).toFixed(1)}%</div>
        </div>
        <div class="pos-meta">
          <span class="tag">${TRACK_JA[p.track] || esc(p.track)}</span>
          <span class="tag">${stratDot(p.strategy)}${esc(p.strategy)}</span>
          ${conv}
          ${p.days != null ? `<span class="tag num">${p.days}日目</span>` : ""}
        </div>
        ${hpHtml}
        <div class="pos-nums num">
          <span>取得 ${fmt(p.entry)}円 × ${fmt(p.shares)}株 = ${fmt(p.entry * p.shares)}円</span>
          <span>現在 ${fmt(p.current)}円</span>
          <span class="${cls(p.pnl)}" style="color:var(--${cls(p.pnl)});font-weight:700">${yen(p.pnl)}</span>
        </div>
      </div>`;
    }
    h += `</div>`;
  }

  /* 📲 実約定の記録: LINEの推奨を見て手動口座で買った/売った直後に、
     その場で記録する（GitHub API 経由・初回のみPAT設定）。
     保有ポジションの直後 = 「買ったものを記録する」文脈の位置に置く */
  function fillCard() {
    if (!d.remote_fill || !d.remote_fill.repo) return "";
    const longs = d.positions.filter(p => p.track === "long");
    const opts = longs.map(p =>
      `<option value="${esc(p.code)}" data-shares="${p.shares}" data-entry="${p.entry}">
         ${esc(p.code)} ${esc(p.name)}</option>`).join("")
      + `<option value="">その他（コードを入力）</option>`;
    return `<div class="card glass" id="fillCard"><h2><span class="em">📲</span>実約定の記録（手動口座）</h2>
      <div class="chart-note" style="margin:-6px 0 12px">NISA推奨の銘柄を実際に売買したら、その場でここに記録。
        送信すると1〜2分でLINEに確認が届き、翌朝PCの正本に取り込まれます。</div>
      <div id="rfToken" class="rf-token"></div>
      <div class="rf-grid">
        <label class="rf-lbl">銘柄<select id="rfCode" class="rf-in">${opts}</select></label>
        <label class="rf-lbl" id="rfOtherWrap" style="display:${longs.length ? "none" : "flex"}">コード（4桁）
          <input id="rfCodeOther" class="rf-in" inputmode="numeric" pattern="[0-9]{4}" placeholder="5351"></label>
        <label class="rf-lbl">売買<select id="rfAction" class="rf-in">
          <option value="buy">買付</option><option value="sell">売却</option></select></label>
        <label class="rf-lbl">株数<input id="rfShares" class="rf-in" type="number" min="1" step="1" inputmode="numeric" placeholder="200"></label>
        <label class="rf-lbl">約定単価（円）<input id="rfPrice" class="rf-in" type="number" min="0.1" step="0.1" inputmode="decimal" placeholder="2060"></label>
        <label class="rf-lbl">約定日<input id="rfDate" class="rf-in" type="date"></label>
        <label class="rf-lbl wide">メモ（任意）<input id="rfNote" class="rf-in" maxlength="100" placeholder="例: 寄付で約定"></label>
      </div>
      <button id="rfSend" class="rf-send">記録を送信</button>
      <div id="rfMsg" class="rf-msg" role="status"></div>
    </div>`;
  }
  h += fillCard();

  /* 直近トレード */
  if (d.trades.length) {
    h += `<div class="card glass"><h2><span class="em">🧾</span>直近の決済</h2>`;
    for (const t of d.trades.slice(0, 12)) {
      const win = t.pnl >= 0;
      h += `<div class="trade">
        <div class="w-orb ${win ? "win" : "loss"}">${win ? "W" : "L"}</div>
        <div class="mid">
          <div class="nm">${esc(t.name)} <span class="pos-code num">${stockLink(t.code)}</span></div>
          <div class="dt num">${esc(t.date)} ・ ${EXIT_JA[t.exit_reason] || esc(t.exit_reason || "—")}
            ${t.holding_days != null ? `・${t.holding_days}日` : ""}</div>
        </div>
        <div class="amt num" style="color:var(--${cls(t.pnl)})">${yen(t.pnl)}
          <span class="p">${t.pnl_pct >= 0 ? "+" : ""}${Number(t.pnl_pct).toFixed(2)}%</span></div>
      </div>`;
    }
    h += `</div>`;
  }

  let dbt = "", calh = "";
  /* AI Bull vs Bear */
  if (d.ai_stories.length) {
    dbt += `<div class="card glass"><h2><span class="em">🤖</span>AI ディベート（強気 vs 弱気）</h2>`;
    for (const s of d.ai_stories) {
      const vc = s.verdict === "veto" ? "v-veto" : s.verdict === "reduce" ? "v-reduce" : "v-proceed";
      const vt = s.verdict === "veto" ? "見送り" : s.verdict === "reduce" ? "縮小" : "GO";
      let outcome = "";
      if (s.outcome) {
        outcome = `<div class="duel-outcome" style="color:var(--${s.outcome.win ? "pos" : "neg"})">
          結果: ${s.outcome.win ? "✅ 勝ち" : "❌ 負け"}
          ${s.outcome.pnl_pct != null ? `(${s.outcome.pnl_pct >= 0 ? "+" : ""}${Number(s.outcome.pnl_pct).toFixed(1)}%)` : ""}</div>`;
      }
      dbt += `<div class="duel">
        <div class="duel-head"><span>${esc(s.name)} <span class="pos-code num">${stockLink(s.code)}</span></span>
          <span class="verdict ${vc}">${vt}</span></div>
        <div class="duel-body">
          <div class="side bull"><div class="s-tag">🐂 強気</div>${esc(s.bull) || "—"}</div>
          <div class="side bear"><div class="s-tag">🐻 弱気</div>${esc(s.bear) || "—"}</div>
        </div>${outcome}</div>`;
    }
    dbt += `</div>`;
  }

  /* AI較正 */
  if (d.calibration.length) {
    calh += `<div class="card glass"><h2><span class="em">🎓</span>AI較正（確信度の答え合わせ）</h2><div class="cal-list">`;
    for (const c of d.calibration) {
      calh += `<div class="cal-row">
        <span class="cal-lbl">${esc(c.label)}</span>
        <div class="cal-bar"><div class="cal-fill" style="width:0" data-w="${c.win_rate}%"></div></div>
        <span class="cal-side num">勝率${c.win_rate}%・${c.n}件</span>
      </div>`;
    }
    calh += `</div><div class="chart-note">AIの確信度が実際の勝率と一致しているかの検証。乖離すると自動でサイズ縮小されます。</div></div>`;
  }

  /* 実弾の往復（ブローカー別）。G1 ゲートは 2026-09-19 に廃止（運用者決定）。
     判断セクション（先頭）から呼ばれる */
  function liveBrokerCard() {
    if (!d.live_brokers || !d.live_brokers.total) return "";
    const g = d.live_brokers, t = g.total, lab = g.labels || {};
    let h = `<div class="card glass"><h2><span class="em">🔴</span>実弾の往復（ブローカー別）</h2>`;
    if (!t.trades) {
      h += `<div class="chart-note">実弾の決済はまだありません。</div></div>`;
      return h;
    }
    const brow = (label, v, strong) => `<tr${strong ? ' style="font-weight:700"' : ""}>
        <td>${label}</td><td class="num">${v.trades}件</td>
        <td class="num ${cls(v.realized)}" style="color:var(--${cls(v.realized)})">${yen(v.realized)}</td>
        <td class="num">${v.win_rate == null ? "—" : v.win_rate + "%"}</td>
        <td class="num">${v.profit_factor == null ? "—" : v.profit_factor}</td></tr>`;
    h += `<table class="mini-table"><thead><tr><th></th><th>往復</th><th>実現損益</th><th>勝率</th><th>PF</th></tr></thead><tbody>`;
    for (const k of Object.keys(g.by_broker || {})) h += brow(esc(lab[k] || k || "不明"), g.by_broker[k], false);
    h += brow("合計", t, true);
    h += `</tbody></table><div class="chart-note">kabu と楽天を同じ実弾行に数える（ブローカー別の内訳つき・2026-09-19 運用者決定）。「不明」は 2026-09-24 以降で印の無い決済。Kill-line（§2）はこの全往復で見る。</div></div>`;
    return h;
  }


  /* NISA枠（年間＋生涯）: 「保有と記録」の末尾に置く */
  if (d.nisa && d.nisa.limit > 0) {
    const used = d.nisa.used || 0;
    const pct = Math.min(used / d.nisa.limit * 100, 100);
    const lused = d.nisa.lifetime_used || 0;
    const llim = d.nisa.lifetime_limit || 0;
    const lpct = llim > 0 ? Math.min(lused / llim * 100, 100) : 0;
    h += `<div class="card glass"><h2><span class="em">🌱</span>NISA成長投資枠</h2>
      <div class="nisa-lbl num">年間 ${esc(d.nisa.year)}</div>
      <div class="nisa-bar"><div class="nisa-fill" data-w="${pct.toFixed(1)}%"></div></div>
      <div class="nisa-cap num"><span>推奨累計 ${fmt(used)}円</span>
        <span>残り ${fmt(Math.max(d.nisa.limit - used, 0))}円</span></div>
      <div class="chart-note" style="margin-top:6px">${
        (d.nisa.real_used || 0) > 0
          ? `実買付済み: <b class="num">${fmt(Math.round(d.nisa.real_used))}円</b>（手動記録ベース）`
          : "実買付の記録なし — 上記は推奨ベースの数字で、現時点の保有は全て紙上です"
      }${
        (d.nisa.overflow || 0) > 0
          ? `<br>枠超過の推奨: <b class="num">${fmt(Math.round(d.nisa.overflow))}円</b>（NISA枠外 — 買うなら課税口座）`
          : ""
      }</div>`;
    if (llim > 0) {
      h += `<div class="nisa-lbl num" style="margin-top:12px">生涯枠（簿価・成長枠）</div>
        <div class="nisa-bar"><div class="nisa-fill" data-w="${lpct.toFixed(1)}%"
          style="background:linear-gradient(90deg,var(--accent2),var(--accent))"></div></div>
        <div class="nisa-cap num"><span>使用 ${fmt(lused)}円</span>
          <span>残り ${fmt(Math.max(llim - lused, 0))}円</span></div>`;
    }
    h += `</div>`;
  }

  /* 組み立て（順序は上の改訂コメントのとおり） */
  h = partHead + h + partJudge + partRef
    + sec("詳細（開いて見る）", "検証・記録の詳細。見出しを押すと開きます。")
    + partFolds
    + fold("🗳 AI ディベート（強気 vs 弱気）", "AI が買う前に交わした議論と、その後の結果", dbt)
    + fold("🎓 AI較正（確信度の答え合わせ）", "AI の確信度と実際の勝率のずれ", calh);
  /* 表は横に収まらないとき表だけを横スクロールさせる（ページ全体を横に揺らさない） */
  h = h.replace(/<table class="mini-table/g, '<div class="tbl"><table class="mini-table')
       .replace(/<\/table>/g, "</table></div>");
  h += `<div class="foot">
    生成 ${esc(d.generated_at)} ・ このページは AES-256-GCM 暗号文のみを含み、
    復号は端末内で行われます<br>投資判断は自己責任で。Epitaph は助言ではありません。
  </div>`;

  app.innerHTML = h;
  wireFillForm(d);
  wireEntryPatterns(d);

  /* ゲート退場 → アプリ入場 */
  const gate = document.getElementById("gate");
  document.getElementById("gateCard").classList.add("away");
  setTimeout(() => {
    gate.style.display = "none";
    app.style.display = "block";
    document.getElementById("guideFab").classList.add("show");
    requestAnimationFrame(() => app.classList.add("in"));

    countUp(document.getElementById("heroNum"), total, 1300);
    /* リング・バーのアニメ発火 */
    for (const el of document.querySelectorAll("[data-off]"))
      requestAnimationFrame(() => el.style.strokeDashoffset = el.dataset.off);
    for (const el of document.querySelectorAll("[data-w]"))
      requestAnimationFrame(() => el.style.width = el.dataset.w);

    if (newATH) {
      document.getElementById("athBadge").style.display = "block";
      setTimeout(confetti, 500);
    }
    drawCharts(d);
    initPosTools();
  }, 420);
}

/* ---------- 📲 実約定の記録（GitHub workflow_dispatch 送信） ---------- */
const PAT_KEY = "epitaph_gh_pat";

function wireFillForm(d) {
  const card = document.getElementById("fillCard");
  if (!card) return;
  const $ = (id) => document.getElementById(id);

  /* PAT（Fine-grained・epitaphリポジトリのActions権限のみ）はこの端末の
     localStorage にだけ保存される。ページには埋め込まれない。 */
  function renderToken() {
    const saved = !!localStorage.getItem(PAT_KEY);
    $("rfToken").innerHTML = saved
      ? `<div class="rf-tok-ok">🔑 GitHub接続: 設定済み（この端末）
           <button id="rfTokChange" class="rf-tok-btn" type="button">変更</button></div>`
      : `<div class="rf-tok-setup">
           <div>初回のみ: GitHubの <b>Fine-grained PAT</b>（対象リポジトリ epitaph のみ・
             権限は <b>Actions: Read and write</b> だけ）を作成し、ここに貼り付けて保存して
             ください。トークンは<b>この端末にのみ</b>保存されます。作成手順は
             リポジトリの docs/DASHBOARD.md にあります。</div>
           <input id="rfTokIn" class="rf-in" type="password" autocomplete="off"
                  placeholder="github_pat_...">
           <button id="rfTokSave" class="rf-tok-btn" type="button">この端末に保存</button>
         </div>`;
    const save = $("rfTokSave");
    if (save) save.addEventListener("click", () => {
      const v = $("rfTokIn").value.trim();
      if (!v) return;
      localStorage.setItem(PAT_KEY, v);
      renderToken();
    });
    const chg = $("rfTokChange");
    if (chg) chg.addEventListener("click", () => {
      localStorage.removeItem(PAT_KEY);
      renderToken();
    });
  }
  renderToken();

  /* 約定日の既定は端末ローカルの今日（sv-SE ロケール = YYYY-MM-DD 表記） */
  $("rfDate").value = new Date().toLocaleDateString("sv-SE");

  /* 銘柄を選ぶと紙上の株数・建値をプレースホルダに反映（入力の手間を削る） */
  function onCodeChange() {
    const sel = $("rfCode");
    const opt = sel.selectedOptions[0];
    $("rfOtherWrap").style.display = sel.value ? "none" : "flex";
    if (opt && opt.dataset.shares) {
      $("rfShares").placeholder = opt.dataset.shares;
      if (!$("rfShares").value) $("rfShares").value = opt.dataset.shares;
      $("rfPrice").placeholder = opt.dataset.entry;
    }
  }
  $("rfCode").addEventListener("change", onCodeChange);
  onCodeChange();

  function show(text, isErr) {
    const m = $("rfMsg");
    m.textContent = text;
    m.className = "rf-msg " + (isErr ? "err" : "ok");
  }

  async function send() {
    const code = ($("rfCode").value || $("rfCodeOther").value).trim();
    const action = $("rfAction").value;
    const shares = $("rfShares").value.trim();
    const price = $("rfPrice").value.trim();
    const date = $("rfDate").value;
    if (!/^[0-9]{4}$/.test(code)) return show("銘柄コードは4桁の数字で入力してください", true);
    if (!(parseInt(shares, 10) > 0)) return show("株数を入力してください", true);
    if (!(parseFloat(price) > 0)) return show("約定単価を入力してください", true);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return show("約定日を選択してください", true);
    const pat = localStorage.getItem(PAT_KEY);
    if (!pat) return show("先に上の「GitHub接続」を設定してください", true);

    const btn = $("rfSend");
    btn.disabled = true;                       /* 二度押し防止（第一の砦） */
    const prev = btn.textContent;
    btn.textContent = "送信中…";
    try {
      const url = `https://api.github.com/repos/${d.remote_fill.repo}` +
                  `/actions/workflows/${d.remote_fill.workflow}/dispatches`;
      const r = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + pat,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ ref: "main", inputs: {
          code, action, shares, price, fill_date: date,
          note: $("rfNote").value.trim(),
          /* サーバ側の二重記録防止に使う送信ID（第二の砦） */
          submission_id: crypto.randomUUID(),
        }}),
      });
      if (r.status === 204) {
        show(`✅ 送信しました: ${code} ${action === "buy" ? "買付" : "売却"} ` +
             `${shares}株 @${price}円 — 1〜2分でLINEに確認が届きます。` +
             `届かなければ再送信してください。`);
        $("rfNote").value = "";
      } else if (r.status === 401) {
        show("❌ トークンが無効です（期限切れの可能性）。「変更」から再設定してください", true);
      } else if (r.status === 403 || r.status === 404) {
        show("❌ トークンの権限が足りません。Fine-grained PATで epitaph リポジトリ + " +
             "Actions: Read and write を許可してください", true);
      } else {
        show(`❌ 送信に失敗しました（HTTP ${r.status}）— 時間を置いて再送信してください`, true);
      }
    } catch (e) {
      show("❌ 通信エラー — 電波状況を確認して再送信してください", true);
    } finally {
      btn.disabled = false;
      btn.textContent = prev;
    }
  }
  $("rfSend").addEventListener("click", send);
}

/* ---------- Chart.js ---------- */
let charts = [];
/* 保有ポジションの並べ替え・絞り込み。既存DOMノードを並べ替え/表示切替する
   だけで再描画しない（テンプレート再構築より壊れにくい）。 */
function initPosTools() {
  const list = document.getElementById("posList");
  const sortSel = document.getElementById("posSort");
  if (!list || !sortSel) return;

  const KEYS = {
    dist:    { attr: "dist", dir: 1 },   // ストップに近い順（要注意が上）
    pnldesc: { attr: "pnl",  dir: -1 },
    pnlasc:  { attr: "pnl",  dir: 1 },
    days:    { attr: "days", dir: -1 },
    code:    { attr: "code", dir: 1 },
  };
  const applySort = () => {
    const k = KEYS[sortSel.value] || KEYS.dist;
    const cards = Array.from(list.children);
    cards.sort((a, b) => {
      const av = a.dataset[k.attr], bv = b.dataset[k.attr];
      const an = parseFloat(av), bn = parseFloat(bv);
      const cmp = (isNaN(an) || isNaN(bn))
        ? String(av).localeCompare(String(bv)) : an - bn;
      return cmp * k.dir;
    });
    for (const c of cards) list.appendChild(c);
  };
  sortSel.addEventListener("change", applySort);

  let filter = "all";
  const applyFilter = () => {
    for (const c of list.children) {
      const ds = c.dataset;
      let show = true;
      if (filter === "short" || filter === "long") show = ds.track === filter;
      else if (filter === "loss") show = parseFloat(ds.pnl) < 0;
      else if (filter === "real") show = ds.real === "1";
      c.style.display = show ? "" : "none";
    }
  };
  for (const btn of document.querySelectorAll(".pchip")) {
    btn.addEventListener("click", () => {
      filter = btn.dataset.pf;
      for (const b of document.querySelectorAll(".pchip"))
        b.classList.toggle("on", b === btn);
      applyFilter();
    });
  }
  applySort();   // 既定: ストップまで近い順（最も注意が要る玉が上）
}

function drawCharts(d) {
  if (typeof Chart === "undefined") return;
  for (const c of charts) c.destroy();
  charts = [];
  /* 色は CSS のトークン（DADS）から読む。チャートだけ別の色になるのを防ぐ */
  const tok = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const gridC = tok("--line");
  const tickC = tok("--muted");
  const pos = tok("--pos");
  const neg = tok("--neg");
  Chart.defaults.font.family = "'Noto Sans JP', -apple-system, 'Hiragino Sans', Meiryo, sans-serif";
  Chart.defaults.font.size = 13;

  const pnlBar = (elId, rows, labelOf) => {
    const el = document.getElementById(elId);
    if (!el || !rows || !rows.length) return;
    charts.push(new Chart(el, {
      type: "bar",
      data: { labels: rows.map(labelOf),
        datasets: [{ data: rows.map(x => x.pnl),
          backgroundColor: rows.map(x => x.pnl >= 0 ? pos : neg),
          borderRadius: 4, maxBarThickness: 34 }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: c => " " + yen(c.parsed.y) } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: tickC } },
          y: { grid: { color: gridC }, border: { display: false },
               ticks: { color: tickC, maxTicksLimit: 5, callback: v => fmt(v) } } } }
    }));
  };
  pnlBar("dailyChart", d.daily, x => x.date.slice(5).replace("-", "/"));
  pnlBar("weeklyChart", d.weekly, x => x.week.slice(5).replace("-", "/") + "週");


  const mo = document.getElementById("monthlyChart");
  if (mo && d.monthly.length) {
    charts.push(new Chart(mo, {
      type: "bar",
      data: { labels: d.monthly.map(x => x.month),
        datasets: [{ label: "月次実現損益", data: d.monthly.map(x => x.pnl),
          backgroundColor: d.monthly.map(x => x.pnl >= 0 ? pos : neg),
          borderRadius: 4, maxBarThickness: 34 }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: c => " " + yen(c.parsed.y) } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: tickC } },
          y: { grid: { color: gridC }, border: { display: false },
               ticks: { color: tickC, maxTicksLimit: 5, callback: v => fmt(v) } } } }
    }));
  }
}

/* テーマ切替でチャート色を追従 */
let lastData = null;
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => {
  if (lastData) drawCharts(lastData);
});

/* ---------- 解錠 ---------- */
async function unlock() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  const card = document.getElementById("gateCard");
  if (!pw) return;
  err.textContent = "復号中…";
  let data;
  try {
    data = await decrypt(pw);
  } catch (e) {
    err.textContent = "パスワードが違います";
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
    return;
  }
  err.textContent = "";
  lastData = data;
  try {
    render(data);
  } catch (e) {
    /* 描画のバグを「パスワードが違います」に化かさない（2026-08-12に
       実際に起き、正しいパスワードが拒否されたように見えた） */
    err.textContent = "表示エラー: " + (e && e.message ? e.message : e);
    throw e;
  }
}
document.getElementById("unlock").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", (e) => {
  if (e.key === "Enter") unlock();
});

document.getElementById("guideFab").addEventListener("click", () => openGuide());
document.getElementById("guideClose").addEventListener("click", closeGuide);
document.querySelector("#guide .guide-scrim").addEventListener("click", closeGuide);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeGuide();
});
/* モーダル内: アコーディオン開閉 */
document.getElementById("guideBody").addEventListener("click", (e) => {
  const head = e.target.closest(".g-head");
  if (!head) return;
  const item = head.closest(".g-item");
  const open = item.classList.toggle("open");
  head.setAttribute("aria-expanded", open);
});
/* アプリ内: 戦略名などの [data-guide] タップでその戦略のガイドを開く。
   ヘッダの「投資法ガイド」ボタン（[data-guide-open]）は一覧を開く */
document.getElementById("app").addEventListener("click", (e) => {
  if (e.target.closest("[data-guide-open]")) { openGuide(); return; }
  const t = e.target.closest("[data-guide]");
  if (t) openGuide(t.getAttribute("data-guide"));
});
