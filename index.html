<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Epitaph</title>
<!-- 唯一の外部スクリプト。実約定記録のPATを localStorage に置くため、
     SRIで改ざんを遮断する（ハッシュ不一致なら読み込まれずチャートのみ欠ける） -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
        integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4"
        crossorigin="anonymous"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #EEF1F7; --bg2: #E3E9F4;
    --ink: #1A2233; --muted: #5A6478; --faint: #8A93A8;
    --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.78);
    --stroke: rgba(255,255,255,.9); --stroke2: rgba(30,40,70,.08);
    --shadow: 0 18px 50px -18px rgba(30,45,90,.28), 0 4px 14px -6px rgba(30,45,90,.14);
    --pos: #177A4C; --neg: #C43D3D; --accent: #1D63C7; --accent2: #7A4BD6;
    --pos-soft: rgba(23,122,76,.12); --neg-soft: rgba(196,61,61,.10);
    --blob1: #B7C9F5; --blob2: #E4C6F0; --blob3: #BEE7D9;
    --ring-track: rgba(30,45,90,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B0F1A; --bg2: #0E1424;
      --ink: #E8ECF5; --muted: #9AA5BC; --faint: #6B7590;
      --glass: rgba(23,30,48,.55); --glass-strong: rgba(28,36,58,.75);
      --stroke: rgba(255,255,255,.14); --stroke2: rgba(255,255,255,.06);
      --shadow: 0 24px 60px -20px rgba(0,0,0,.65), 0 6px 18px -8px rgba(0,0,0,.5);
      --pos: #3DD68C; --neg: #FF6B6B; --accent: #2E7FE8; --accent2: #9D6BFF;
      --pos-soft: rgba(61,214,140,.13); --neg-soft: rgba(255,107,107,.12);
      --blob1: #1E3A8A; --blob2: #5B21B6; --blob3: #065F46;
      --ring-track: rgba(255,255,255,.09);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    overflow-x: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ---- 背景: 漂うグラデーションブロブ ---- */
  #bg { position: fixed; inset: -20%; z-index: -1; overflow: hidden;
        background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%); }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .b1 { width: 55vw; height: 55vw; background: var(--blob1); top: -8%; left: -12%;
        animation: drift1 26s ease-in-out infinite alternate; }
  .b2 { width: 46vw; height: 46vw; background: var(--blob2); top: 28%; right: -14%;
        animation: drift2 32s ease-in-out infinite alternate; }
  .b3 { width: 40vw; height: 40vw; background: var(--blob3); bottom: -12%; left: 22%;
        animation: drift3 38s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(9vw, 7vh) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-7vw, -6vh) scale(.92); } }
  @keyframes drift3 { to { transform: translate(-5vw, -8vh) scale(1.08); } }
  @media (prefers-reduced-motion: reduce) {
    .blob { animation: none !important; }
    * { transition: none !important; animation-duration: .001s !important; }
  }

  /* ---- ガラスパネル共通 ---- */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(1.6);
    backdrop-filter: blur(22px) saturate(1.6);
    border-radius: 26px;
    border: 1px solid var(--stroke2);
    box-shadow: var(--shadow), inset 0 1px 0 var(--stroke);
    position: relative; overflow: hidden;
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: var(--glass-strong); }
  }
  .glass::before { /* 上端スペキュラハイライト */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 42%;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0));
    pointer-events: none; border-radius: 26px 26px 0 0;
  }

  .wrap { max-width: 860px; margin: 0 auto; padding: 18px 16px 60px; }

  /* 取得合計カードのトラック別チップ。.split は .hero 配下専用セレクタで
     hero外ではflexにならない（チップが行内テキスト扱いで千切れた）— 専用に定義 */
  .acq-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

  /* ポジションカードの並び（モバイル1列 → PC2列） */
  .pos-list { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
  .pos-list .pos-card { margin-bottom: 0; }
  .grid2 > .card { margin-bottom: 0; }

  /* ---- パスワードゲート ---- */
  #gate { min-height: 92vh; display: flex; align-items: center; justify-content: center; }
  .gate-card { width: min(400px, 92vw); padding: 40px 30px 32px; text-align: center;
               transition: transform .5s cubic-bezier(.2,.9,.3,1.2), opacity .4s; }
  .gate-card.away { transform: scale(1.06) translateY(-14px); opacity: 0; }
  .lock-orb { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 12px 30px -8px rgba(60,90,220,.55), inset 0 1px 0 rgba(255,255,255,.4); }
  .gate-card h1 { font-size: 22px; letter-spacing: .12em; font-weight: 700; }
  .gate-card .sub { color: var(--muted); font-size: 13px; margin: 8px 0 22px; }
  .gate-card input {
    width: 100%; padding: 14px 16px; font-size: 16px; border-radius: 14px;
    border: 1px solid var(--stroke2); background: var(--glass-strong);
    color: var(--ink); outline: none; text-align: center; letter-spacing: .1em;
    transition: box-shadow .2s; }
  .gate-card input:focus { box-shadow: 0 0 0 3px rgba(80,120,240,.35); }
  .gate-card button {
    width: 100%; margin-top: 14px; padding: 14px; font-size: 16px; font-weight: 700;
    border: none; border-radius: 14px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 10px 26px -8px rgba(70,90,230,.6), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .15s, filter .2s; }
  .gate-card button:active { transform: scale(.97); filter: brightness(1.1); }
  .err { color: var(--neg); font-size: 13px; min-height: 20px; margin-top: 12px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px);} 40%,80% { transform: translateX(8px);} }

  /* ---- アプリ ---- */
  #app { display: none; opacity: 0; transform: translateY(10px);
         transition: opacity .6s, transform .6s; }
  #app.in { opacity: 1; transform: none; }

  .top { display: flex; align-items: center; justify-content: space-between;
         padding: 8px 6px 16px; }
  .brand { font-weight: 800; letter-spacing: .22em; font-size: 15px; }
  .asof { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11.5px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--pos);
           box-shadow: 0 0 0 0 var(--pos); animation: pulse 2.4s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(0,0,0,0); } }

  .hero { padding: 26px 24px 22px; text-align: center; margin-bottom: 14px; }
  .hero .label { font-size: 12px; color: var(--muted); letter-spacing: .14em; }
  .hero .big { font-size: clamp(38px, 11vw, 56px); font-weight: 800; line-height: 1.15;
               margin: 6px 0 2px; }
  .hero .big.pos { color: var(--pos); text-shadow: 0 0 34px var(--pos-soft); }
  .hero .big.neg { color: var(--neg); text-shadow: 0 0 34px var(--neg-soft); }
  .hero .split { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
                 margin-top: 12px; }
  /* チップはピル内で途中改行させない（「…2,399,100 / 円」と千切れて崩れた
     実例あり）。収まらない時はチップごと次の行へ送る（コンテナ側のwrap） */
  .chip { padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
          background: var(--glass-strong); border: 1px solid var(--stroke2);
          color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--ink); }
  .chip.pos b { color: var(--pos); } .chip.neg b { color: var(--neg); }
  .ath-badge { display: none; margin: 10px auto 0; width: fit-content;
    padding: 6px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    color: #7A5A00; background: linear-gradient(135deg, #FFE9A8, #FFD666);
    box-shadow: 0 6px 18px -6px rgba(255,190,40,.55); }
  @media (prefers-color-scheme: dark) { .ath-badge { color: #3d2e00; } }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr);
          gap: 12px; margin-bottom: 14px; }
  @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .tile { padding: 16px 14px; text-align: center; }
  .tile .t-label { font-size: 11px; color: var(--muted); letter-spacing: .05em; }
  .tile .t-val { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .tile .t-sub { font-size: 10.5px; color: var(--faint); margin-top: 3px; }

  .card { padding: 20px; margin-bottom: 14px; }
  .card h2 { font-size: 13.5px; color: var(--muted); font-weight: 700;
             letter-spacing: .08em; margin-bottom: 14px; display: flex;
             align-items: center; gap: 8px; }
  .card h2 .em { font-size: 16px; }

  /* 目標リング */
  .ring-wrap { display: flex; align-items: center; gap: 18px; }
  .ring-box { position: relative; width: 116px; height: 116px; flex: none; }
  .ring-box svg { transform: rotate(-90deg); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; }
  .ring-center .pct { font-size: 23px; font-weight: 800; }
  .ring-center .cap { font-size: 10px; color: var(--faint); }
  .ring-info .line1 { font-size: 15px; font-weight: 700; }
  .ring-info .line2 { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .ring-info .line3 { font-size: 12.5px; margin-top: 8px; font-weight: 600; }

  .streak-face { font-size: 40px; line-height: 1; }
  .streak-num { font-size: 26px; font-weight: 800; margin-top: 4px; }
  .streak-cap { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

  .rec-row { display: flex; justify-content: space-between; align-items: center;
             padding: 9px 0; border-bottom: 1px solid var(--stroke2); font-size: 13px; }
  .rec-row:last-child { border-bottom: none; }
  .rec-row .who { color: var(--muted); overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; max-width: 55%; }

  .chart-box { position: relative; height: 210px; }
  .chart-note { font-size: 10.5px; color: var(--faint); margin-top: 10px; }

  /* 戦略別 期待値 vs 実績 */
  .strat { padding: 14px 0; border-bottom: 1px solid var(--stroke2); }
  .strat:last-child { border-bottom: none; padding-bottom: 2px; }
  .strat-head { display: flex; align-items: center; gap: 8px; }
  .strat-name { font-weight: 700; font-size: 14px; flex: 1;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strat-real { font-size: 15px; font-weight: 800; white-space: nowrap; }
  .strat-real.muted { color: var(--faint); font-weight: 600; font-size: 12px; }
  .strat-sub { margin: 7px 0 11px; }
  .strat-chip { font-size: 11px; padding: 4px 11px; border-radius: 999px; font-weight: 700;
                background: var(--glass-strong); border: 1px solid var(--stroke2);
                color: var(--muted); display: inline-flex; align-items: baseline; gap: 7px;
                white-space: nowrap; }
  .strat-chip.muted { font-weight: 500; color: var(--faint); }
  .strat-chip .chip-sub { font-size: 10px; color: var(--faint); font-weight: 600; }
  .strat-grid { display: grid; grid-template-columns: 1fr auto auto; gap: 7px 16px;
                align-items: center; }
  .sg-h { font-size: 9.5px; color: var(--faint); letter-spacing: .05em; text-align: right; }
  .sg-h span { display: inline-block; margin-left: 4px; padding: 1px 5px; border-radius: 5px;
               background: var(--ring-track); font-size: 8.5px; }
  .sg-l { font-size: 12px; color: var(--muted); }
  .sg-e, .sg-a { text-align: right; font-size: 13px; font-weight: 700;
                 font-variant-numeric: tabular-nums; min-width: 46px; }
  .sg-e { color: var(--muted); }
  .sg-a.muted { color: var(--faint); font-weight: 500; }
  .strat-guide { flex: none; width: 20px; height: 20px; border-radius: 50%;
                 border: 1px solid var(--stroke2); background: var(--glass-strong);
                 color: var(--muted); font-size: 12px; line-height: 1; cursor: pointer;
                 padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .strat-guide:active { transform: scale(.9); }

  /* 判断ダッシュボード: 鮮度・警告・moon・セクション区切り */
  .stale-banner { background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.45);
    color: var(--neg); padding: 13px 16px; border-radius: 14px; font-size: 12.5px;
    font-weight: 700; line-height: 1.6; margin-bottom: 14px; }
  .status-ok { font-size: 11px; color: var(--faint); margin: 2px 6px 14px; }
  .warn-card { border-color: rgba(255,107,107,.5) !important; }
  .warn-item { font-size: 12px; color: var(--neg); padding: 7px 0; line-height: 1.65;
    border-bottom: 1px solid var(--stroke2); }
  .warn-item:last-child { border-bottom: none; }
  .sec-label { font-size: 10.5px; color: var(--faint); letter-spacing: .06em;
    font-weight: 700; margin: 26px 6px 10px; }
  .moon-card { border-color: rgba(157,107,255,.4) !important; }
  .moon-thesis { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 8px 0 10px; }

  /* 投資法ガイド: FAB + モーダル */
  #guideFab { position: fixed; right: 18px; bottom: 20px; z-index: 40;
              width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--stroke);
              background: var(--glass-strong); backdrop-filter: blur(18px) saturate(160%);
              -webkit-backdrop-filter: blur(18px) saturate(160%);
              box-shadow: 0 8px 26px rgba(0,0,0,.28); font-size: 23px; cursor: pointer;
              display: none; opacity: 0; transform: scale(.6);
              transition: opacity .4s, transform .4s cubic-bezier(.2,.8,.2,1); }
  #guideFab.show { display: block; opacity: 1; transform: scale(1); }
  #guideFab:active { transform: scale(.92); }
  #guide { position: fixed; inset: 0; z-index: 50; display: none; }
  #guide.show { display: block; }
  .guide-scrim { position: absolute; inset: 0; background: rgba(6,10,20,.5);
                 backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
                 opacity: 0; animation: scrimIn .3s forwards; }
  @keyframes scrimIn { to { opacity: 1; } }
  .guide-panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88vh;
                 border-radius: 26px 26px 0 0; padding: 8px 16px 24px;
                 display: flex; flex-direction: column;
                 transform: translateY(100%); animation: sheetIn .42s cubic-bezier(.2,.85,.2,1) forwards; }
  @media (min-width: 620px) {
    .guide-panel { left: 50%; right: auto; bottom: auto; top: 50%; width: 560px; max-height: 82vh;
                   border-radius: 24px; transform: translate(-50%, -46%); animation: sheetInC .4s forwards; }
    @keyframes sheetInC { from { opacity: 0; transform: translate(-50%, -42%); }
                          to { opacity: 1; transform: translate(-50%, -50%); } }
  }
  @keyframes sheetIn { to { transform: translateY(0); } }
  .guide-top { display: flex; align-items: center; justify-content: space-between;
               padding: 10px 4px 8px; position: sticky; top: 0; }
  .guide-top h2 { font-size: 17px; font-weight: 800; }
  #guideClose { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--stroke2);
                background: var(--glass-strong); color: var(--muted); font-size: 15px; cursor: pointer; }
  .guide-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 6px; }
  .guide-intro { font-size: 11px; color: var(--faint); line-height: 1.7; margin-bottom: 12px;
                 padding: 10px 12px; border-radius: 12px; background: var(--glass); }
  .g-item { border: 1px solid var(--stroke2); border-radius: 16px; margin-bottom: 10px;
            overflow: hidden; background: var(--glass); }
  .g-head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 13px 14px;
            background: none; border: none; cursor: pointer; text-align: left; color: var(--ink); }
  .g-name { font-weight: 700; font-size: 13.5px; flex: 1; }
  .g-badges { display: flex; gap: 5px; }
  .g-badge { font-size: 9px; padding: 2px 7px; border-radius: 999px; font-weight: 700;
             color: var(--muted); background: var(--glass-strong); border: 1px solid var(--stroke2);
             white-space: nowrap; }
  .g-badge.bt-y { color: var(--pos); } .g-badge.bt-n { color: var(--faint); }
  .g-caret { color: var(--faint); font-size: 12px; transition: transform .25s; }
  .g-item.open .g-caret { transform: rotate(180deg); }
  .g-panel { max-height: 0; overflow: hidden; transition: max-height .35s ease;
             padding: 0 14px; }
  .g-item.open .g-panel { max-height: 640px; padding: 2px 14px 14px; }
  .g-tag { font-size: 12.5px; font-weight: 700; color: var(--accent); line-height: 1.6;
           margin: 4px 0 10px; }
  .g-row, .g-risk { display: grid; grid-template-columns: 68px 1fr; gap: 10px;
                    padding: 7px 0; border-top: 1px solid var(--stroke2); }
  .g-h { font-size: 10.5px; color: var(--faint); font-weight: 700; padding-top: 1px; }
  .g-t { font-size: 12px; color: var(--muted); line-height: 1.65; }
  .g-risk .g-h { color: var(--neg); }

  /* ポジションカード */
  .pos-card { padding: 16px 18px; margin-bottom: 12px; }
  .pos-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .pos-name { font-weight: 700; font-size: 15px; }
  .pos-code { color: var(--faint); font-size: 11.5px; margin-left: 6px; }
  .ext-link { color: inherit; text-decoration: none;
              border-bottom: 1px dotted var(--faint); }
  .ext-link:hover { color: #2E7FE8; }
  /* 保有ポジションの並べ替え・絞り込み */
  .pos-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
               margin: 0 6px 12px; }
  .pos-tools select { background: var(--card, rgba(255,255,255,.06));
      color: inherit; border: 1px solid var(--faint); border-radius: 8px;
      padding: 6px 10px; font-size: 12.5px; }
  .pchip { background: none; color: var(--muted); border: 1px solid var(--faint);
      border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .pchip.on { color: #fff; background: #2E7FE8; border-color: #2E7FE8; }
  .eta-line { font-size: 13px; margin: 10px 2px 0; }
  .eta-sub { font-size: 11px; color: var(--faint); }
  @media (max-width: 640px) { .rpg-ach { grid-template-columns: repeat(4, 1fr); } }
  .pos-pnl { font-size: 21px; font-weight: 800; white-space: nowrap; }
  .pos-meta { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
  .tag { font-size: 10.5px; padding: 3px 10px; border-radius: 999px; font-weight: 600;
         background: var(--glass-strong); border: 1px solid var(--stroke2);
         color: var(--muted); display: inline-flex; align-items: center; gap: 5px;
         white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .hp { position: relative; height: 10px; border-radius: 999px; background: var(--ring-track);
        overflow: visible; }
  .hp-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px;
             background: linear-gradient(90deg, var(--accent), var(--pos));
             transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .hp-cursor { position: absolute; top: -3px; width: 4px; height: 16px; border-radius: 2px;
               background: var(--ink); box-shadow: 0 0 0 2px var(--bg); }
  .hp-labels { display: flex; justify-content: space-between; font-size: 10.5px;
               color: var(--faint); margin-top: 7px; }
  .pos-nums { display: flex; justify-content: space-between; font-size: 12px;
              color: var(--muted); margin-top: 10px; flex-wrap: wrap; gap: 6px; }

  /* トレード行 */
  .trade { display: flex; align-items: center; gap: 12px; padding: 11px 4px;
           border-bottom: 1px solid var(--stroke2); font-size: 13px; }
  .trade:last-child { border-bottom: none; }
  .w-orb { width: 34px; height: 34px; border-radius: 12px; flex: none; display: flex;
           align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
  .w-orb.win { background: var(--pos-soft); color: var(--pos); }
  .w-orb.loss { background: var(--neg-soft); color: var(--neg); }
  .trade .mid { flex: 1; min-width: 0; }
  .trade .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trade .dt { font-size: 11px; color: var(--faint); }
  .trade .amt { text-align: right; font-weight: 700; white-space: nowrap; }
  .trade .amt .p { font-size: 11px; font-weight: 600; color: var(--faint); display: block; }

  /* Bull/Bear */
  .duel { border-radius: 18px; border: 1px solid var(--stroke2); padding: 14px;
          margin-bottom: 12px; background: var(--glass-strong); }
  .duel-head { display: flex; justify-content: space-between; align-items: center;
               margin-bottom: 10px; font-size: 13.5px; font-weight: 700; }
  .verdict { font-size: 10.5px; padding: 3px 10px; border-radius: 999px; font-weight: 700; }
  .v-proceed { background: var(--pos-soft); color: var(--pos); }
  .v-reduce { background: rgba(192,126,31,.15); color: #C07E1F; }
  .v-veto { background: var(--neg-soft); color: var(--neg); }
  .duel-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .duel-body { grid-template-columns: 1fr; } }
  .side { border-radius: 12px; padding: 10px 12px; font-size: 12px; line-height: 1.6; }
  .side.bull { background: var(--pos-soft); }
  .side.bear { background: var(--neg-soft); }
  .side .s-tag { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; }
  .side.bull .s-tag { color: var(--pos); } .side.bear .s-tag { color: var(--neg); }
  .duel-outcome { margin-top: 10px; font-size: 12px; font-weight: 700; }

  /* 較正バー・G1ゲート。行ごとにgridを組むとラベル列の幅が行間で揃わず、
     64px固定では「決済トレード数」が語中で折り返れた。リスト全体を1つの
     gridにして max-content で全行の列幅を共有する（.cal-row は
     display:contents で行のまとまりだけ残す）。 */
  .cal-list { display: grid; align-items: center; font-size: 12.5px;
              grid-template-columns: max-content minmax(48px, 1fr) max-content;
              column-gap: 12px; row-gap: 12px; }
  .cal-row { display: contents; }
  /* 日本語は既定でどこでも改行されるため、語中改行を明示的に止める */
  .cal-lbl { word-break: keep-all; overflow-wrap: normal; }
  .cal-bar { height: 12px; border-radius: 999px; background: var(--ring-track);
             overflow: hidden; min-width: 0; }
  .cal-fill { height: 100%; border-radius: 999px; background:
              linear-gradient(90deg, var(--accent), var(--accent2));
              transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .cal-side { text-align: right; color: var(--muted); white-space: nowrap; }

  /* NISAゲージ */
  .nisa-lbl { font-size: 10.5px; color: var(--faint); margin-bottom: 6px; }
  .nisa-bar { height: 14px; border-radius: 999px; background: var(--ring-track); overflow: hidden; }
  .nisa-fill { height: 100%; border-radius: 999px;
               background: linear-gradient(90deg, #1F9D66, #2E7FE8); width: 0;
               transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .nisa-cap { display: flex; justify-content: space-between; font-size: 11.5px;
              color: var(--muted); margin-top: 8px; }

  /* 📲 実約定の記録フォーム（スマホから記録 → GitHub Actions 経由） */
  .rf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rf-lbl { display: flex; flex-direction: column; gap: 5px; font-size: 11px;
            color: var(--muted); font-weight: 600; }
  .rf-lbl.wide { grid-column: 1 / -1; }
  .rf-in { padding: 10px 12px; font-size: 16px; border-radius: 12px;
           border: 1px solid var(--stroke2); background: var(--glass-strong);
           color: var(--ink); outline: none; width: 100%; }
  .rf-in:focus { box-shadow: 0 0 0 3px rgba(80,120,240,.35); }
  .rf-send { width: 100%; margin-top: 12px; padding: 13px; font-size: 15px;
             font-weight: 700; border: none; border-radius: 13px; color: #fff;
             cursor: pointer;
             background: linear-gradient(135deg, var(--accent), var(--accent2));
             box-shadow: 0 10px 26px -8px rgba(70,90,230,.5); }
  .rf-send:disabled { opacity: .55; cursor: default; }
  .rf-send:active { transform: scale(.98); }
  .rf-msg { font-size: 12.5px; margin-top: 10px; min-height: 18px; line-height: 1.7; }
  .rf-msg.ok { color: var(--pos); font-weight: 700; }
  .rf-msg.err { color: var(--neg); font-weight: 700; }
  .rf-token { margin-bottom: 12px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .rf-tok-setup { display: flex; flex-direction: column; gap: 8px; padding: 12px;
                  border-radius: 12px; background: var(--glass-strong);
                  border: 1px dashed var(--stroke2); }
  .rf-tok-ok { display: flex; align-items: center; gap: 10px; }
  .rf-tok-btn { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--stroke2);
                background: var(--glass-strong); color: var(--ink); font-size: 12px;
                cursor: pointer; width: fit-content; }

  /* ウォームアップ */
  .warm { text-align: center; padding: 44px 24px; }
  .warm .orbit { width: 66px; height: 66px; margin: 0 auto 16px; border-radius: 50%;
    border: 3px solid var(--ring-track); border-top-color: var(--accent);
    animation: spin 2.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .warm h3 { font-size: 17px; margin-bottom: 8px; }
  .warm p { font-size: 13px; color: var(--muted); line-height: 1.8; }

  .foot { text-align: center; color: var(--faint); font-size: 10.5px;
          margin-top: 26px; line-height: 1.8; }
  .pos-c { color: var(--pos); } .neg-c { color: var(--neg); }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

  /* ---- PC最適化: 運用者は主にPCで閲覧するため、広い画面では幅を広げて
       カード類を2カラム化する（860px単列は間延びする）。
       ※ このブロックはCSSの最後に置くこと — メディアクエリは詳細度を
         上げないため、後方の基本定義に上書きされる（実際に起きた） ---- */
  @media (min-width: 1100px) {
    .wrap { max-width: 1240px; padding: 26px 32px 80px; }
    .pos-list { grid-template-columns: 1fr 1fr; }
    .strat-wrap { display: grid; grid-template-columns: 1fr 1fr;
                  column-gap: 36px; }
    .strat-wrap .strat:nth-last-child(-n+2) { border-bottom: none; }
    .rf-grid { grid-template-columns: repeat(4, 1fr); }
    .rf-send { width: auto; min-width: 280px; }
    .chart-box { height: 250px; }
  }
</style>
</head>

</div>

/* ---------- 復号 (AES-256-GCM + PBKDF2-HMAC-SHA256) ---------- */
function b64ToBytes(b64) {
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function decrypt(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(ENC.salt), iterations: ENC.iterations, hash: "SHA-256" },
    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(ENC.iv) }, key, b64ToBytes(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ---------- ユーティリティ ---------- */
const fmt = (n) => Math.round(Number(n)).toLocaleString("ja-JP");
/* 負号はASCIIの "-" を使う。U+2212 は日本語フォントで長音「ー」と
   見分けがつかない（-123,456円 が ー123,456円 に見える）ため */
const yen = (n) => (n >= 0 ? "+" : "-") + fmt(Math.abs(n)) + "円";
const cls = (n) => (n >= 0 ? "pos" : "neg");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 銘柄コード → 外部チャートへのリンク（株価の推移を見るため。運用者の要望
   2026-08-12）。かぶたんのチャートページ。コードは英数4-5桁に限定して
   URLへ埋める（URL文脈用の白リスト検証。escでは不十分）。 */
const stockLink = (code) => {
  const c = String(code ?? "");
  if (!/^[0-9A-Z]{4,5}$/.test(c)) return esc(c);
  return `<a class="ext-link" href="https://kabutan.jp/stock/chart?code=${c}" target="_blank" rel="noopener noreferrer" title="かぶたんでチャートを開く">${c}⧉</a>`;
};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isDark = () => matchMedia("(prefers-color-scheme: dark)").matches;

function countUp(el, target, dur) {
  if (reduceMotion || Math.abs(target) < 1) {
    el.textContent = yen(target); return;
  }
  const t0 = performance.now();
  (function tick(t) {
    const p = Math.min((t - t0) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = yen(target * ease);
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
}

function ringSVG(pct, size, stroke, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const off = c * (1 - Math.min(Math.max(pct, 0), 1));
  return `<svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
      stroke="var(--ring-track)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none"
      stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${reduceMotion ? off : c}"
      style="transition: stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)"
      data-off="${off}"/>
  </svg>`;
}

/* ---------- 紙吹雪 (最高益更新時のみ・reduced-motion時は無効) ---------- */
function confetti() {
  if (reduceMotion) return;
  const cv = document.getElementById("confetti");
  const ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#2E7FE8", "#D4569B", "#1F9D66", "#C07E1F", "#FFD666"];
  const parts = Array.from({ length: 130 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
    vy: 2.2 + Math.random() * 3, vx: -1.5 + Math.random() * 3,
    rot: Math.random() * Math.PI, vr: -.12 + Math.random() * .24,
    c: colors[(Math.random() * colors.length) | 0],
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
    }
    if (t - t0 < 2600) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })(t0);
}

    /* ダッシュボード自身が「止まっている」ことを叫ぶ（表示層のfail-silent対策）。
       データ日が3日超前なら赤帯。週末を跨いでも金曜データは月曜まで正常扱い。 */
    if (!d.last_updated || d.last_updated === "—") return "";
    const dt = new Date(d.last_updated + "T15:00:00+09:00");
    if (isNaN(dt.getTime())) return "";
    const days = Math.floor((Date.now() - dt.getTime()) / 86400000);
    if (days <= 3) return "";
    return `<div class="stale-banner">⚠️ データが <b>${days}日前（${esc(d.last_updated)}）</b>から更新されていません
      — PC・タスクスケジューラ・同期の停止を確認してください</div>`;

      : "";
    const wkCard = (d.weekly || []).length
      ? `<div class="card glass"><h2><span class="em">🗓️</span>週次実現収支</h2>
          <div class="chart-box"><canvas id="weeklyChart"></canvas></div>
          <div class="chart-note">月曜起点の週ごとの確定損益（直近8週）。</div></div>`
      : "";
    const moCard = d.monthly.length
      ? `<div class="card glass"><h2><span class="em">📊</span>月次実現損益</h2>
          <div class="chart-box"><canvas id="monthlyChart"></canvas></div>
          <div class="chart-note">月次目標: +${fmt(d.monthly_target)}円（資金の5%）</div></div>`
      : "";
    h += (dayCard && wkCard) ? `<div class="grid2">${dayCard}${wkCard}</div>` : dayCard + wkCard;
    h += moCard;
  }

  /* 戦略別: 期待値(BT) vs 実績(ペーパー)。判断セクション（先頭）から呼ばれる */
  function strategyCard() {
    if (!d.strategies || !d.strategies.length) return "";
    let h = "";
    const bm = d.backtest_meta || {};
    h += `<div class="card glass"><h2><span class="em">🎛️</span>戦略別 期待値 vs 実績</h2>
      <div class="chart-note" style="margin:-2px 0 14px">
        「期待値」はバックテスト（${esc(bm.period || "")}・${fmt(bm.capital || 0)}円）の数字＝<b>仮説</b>。
        サバイバーシップ等で上振れしています。<b>「実績」が前向きペーパーの真の姿</b>で、
        これが期待値に近づくかを見ます。</div>`;
    h += `<div class="strat-wrap">`;
    for (const s of d.strategies) {
      const a = s.actual, e = s.expected;
      const realTag = a
        ? `<span class="strat-real num" style="color:var(--${cls(a.realized)})">${yen(a.realized)}</span>`
        : `<span class="strat-real muted">実績なし</span>`;
      const expChip = e
        ? `<span class="strat-chip">バックテスト期待 <b class="num">${e.return_pct >= 0 ? "+" : ""}${e.return_pct}%</b>
             <span class="chip-sub num">年率${e.annual_pct >= 0 ? "+" : ""}${e.annual_pct}%</span></span>`
        : `<span class="strat-chip muted">${esc(s.expected_reason || "バックテスト対象外")}</span>`;
      const row = (label, ev, av) => `
        <div class="sg-l">${label}</div>
        <div class="sg-e num">${ev}</div>
        <div class="sg-a num ${av === "—" ? "muted" : ""}">${av}</div>`;
      const guideBtn = GUIDE_KEYS.has(s.name)
        ? `<button class="strat-guide" data-guide="${esc(s.name)}" aria-label="この投資法の説明">ⓘ</button>` : "";
      h += `<div class="strat">
        <div class="strat-head">${stratDot(s.name)}<span class="strat-name">${esc(s.name)}</span>${guideBtn}${realTag}</div>
        <div class="strat-sub">${expChip}</div>
        <div class="strat-grid">
          <div class="sg-h"></div><div class="sg-h">期待値<span>バックテスト</span></div><div class="sg-h">実績<span>ペーパー</span></div>
          ${row("勝率",
              e ? e.win_rate + "%" : "—",
              a && a.win_rate != null ? a.win_rate + "%" : "—")}
          ${row("損益レシオ",
              e ? e.profit_factor : "—",
              a && a.profit_factor != null ? a.profit_factor
                : (a && a.trades && a.win_rate >= 100 ? "∞" : "—"))}
          ${row("トレード数",
              e ? e.trades : "—",
              a ? a.trades : "0")}
          ${row("平均保有",
              e ? e.avg_hold + "日" : "—",
              a && a.avg_hold != null ? a.avg_hold + "日" : "—")}
          ${row("1取引平均",
              "—",
              a && a.avg_pnl_pct != null ? (a.avg_pnl_pct >= 0 ? "+" : "") + a.avg_pnl_pct + "%" : "—")}
        </div>
      </div>`;
    }
    h += `</div></div>`;
    return h;
  }

  /* 🚀 ムーンショット枠: 仮説主体の表示（価格でなく仮説で判断する枠のため、
     損益は非強調。設計思想は docs/MOONSHOT.md） */
  const moonPos = d.positions.filter(p => p.track === "moon");
  const corePos = d.positions.filter(p => p.track !== "moon");
  if (moonPos.length) {
    h += `<h2 style="font-size:13.5px;color:var(--muted);letter-spacing:.08em;
      font-weight:700;margin:22px 6px 12px;">🚀 ムーンショット枠（仮説で判断・価格は見ない）</h2>`;
    h += `<div class="pos-list">`;
    for (const p of moonPos) {
      const months = p.days != null ? Math.max(1, Math.round(p.days / 30.44)) : null;
      h += `<div class="pos-card glass moon-card">
        <div class="pos-head">
          <div class="pos-name">${esc(p.name)}<span class="pos-code num">${stockLink(p.code)}</span></div>
          <span class="tag num">${months != null ? "保有" + months + "ヶ月目" : ""}</span>
        </div>
        <div class="moon-thesis">${esc(p.reason || "（仮説メモなし）")}</div>
        <div class="pos-nums num" style="color:var(--faint)">
          <span>取得 ${fmt(p.entry)}円 × ${fmt(p.shares)}株 = ${fmt(p.entry * p.shares)}円</span>
          <span>現在 ${fmt(p.current)}円</span>
        </div>
      </div>`;
    }
    h += `</div>`;
    h += `<div class="chart-note" style="margin:-4px 6px 14px">売る理由は「仮説の崩壊」のみ。
      下落そのものは売る理由になりません（月初のLINE点検で判断）。</div>`;
  }

  /* 保有ポジション（コア: 短期・長期） */
  if (corePos.length) {
    h += `<h2 style="font-size:13.5px;color:var(--muted);letter-spacing:.08em;
      font-weight:700;margin:22px 6px 12px;">💼 保有ポジション <span class="num" style="font-weight:400">${corePos.length}件</span></h2>`;

    /* 並べ替え・絞り込み（運用者の要望 2026-08-12: 順不同で見づらい）。
       DOMの並び替えだけで実装（再描画しない＝壊れにくい） */
    h += `<div class="pos-tools">
      <select id="posSort" aria-label="並べ替え">
        <option value="dist">ストップまで近い順（要注意が上）</option>
        <option value="pnldesc">含み益が大きい順</option>
        <option value="pnlasc">含み損が大きい順</option>
        <option value="days">保有が長い順</option>
        <option value="code">コード順</option>
      </select>
      <button class="pchip on" data-pf="all">すべて</button>
      <button class="pchip" data-pf="short">短期</button>
      <button class="pchip" data-pf="long">長期</button>
      <button class="pchip" data-pf="loss">含み損のみ</button>
      <button class="pchip" data-pf="real">実買付のみ</button>
    </div>`;

    /* 取得合計・評価額合計（トラック別内訳つき）。長期は紙上建値ベース —
       実際に買った額は NISAパネルの「実買付済み額」（手動記録）が真実 */
    const acqOf = (arr) => arr.reduce((s, p) => s + p.entry * p.shares, 0);
    const valOf = (arr) => arr.reduce((s, p) => s + p.current * p.shares, 0);
    const acqAll = acqOf(d.positions), valAll = valOf(d.positions);
    const byTrack = ["short", "long", "moon"]
      .map(t => [t, acqOf(d.positions.filter(p => p.track === t))])
      .filter(([, v]) => v > 0)
      .map(([t, v]) => `<span class="chip">${TRACK_JA[t] || t} <b class="num">${fmt(v)}円</b></span>`)
      .join(" ");
    h += `<div class="card glass" style="padding:14px 18px">
      <div class="pos-nums num" style="margin-top:0">
        <span>取得合計 <b>${fmt(acqAll)}円</b></span>
        <span>評価額 <b>${fmt(valAll)}円</b></span>
        <span class="${cls(valAll - acqAll)}" style="color:var(--${cls(valAll - acqAll)});font-weight:700">${yen(valAll - acqAll)}</span>
      </div>
      <div class="acq-chips">${byTrack}</div>
      <div class="chart-note">長期は紙上建値ベースの合計。実際に買付済みの額は下のNISAパネル「実買付済み」を参照。</div>
    </div>`;
    h += `<div class="pos-list" id="posList">`;
    for (const p of corePos) {
      const sl = p.stop_loss, tp = p.take_profit;
      let hpHtml = "";
      if (sl && tp && tp > sl) {
        const cur = Math.min(Math.max((p.current - sl) / (tp - sl), 0), 1);
        const ent = Math.min(Math.max((p.entry - sl) / (tp - sl), 0), 1);
        hpHtml = `<div class="hp">
            <div class="hp-fill" style="width:0" data-w="${(cur*100).toFixed(1)}%"></div>
            <div class="hp-cursor" style="left:calc(${(ent*100).toFixed(1)}% - 2px);
                 opacity:.35" title="取得価格"></div>
          </div>
          <div class="hp-labels"><span>SL ${fmt(sl)}</span>
            <span>利確ライン ${fmt(tp)}</span></div>`;
      } else if (sl) {
        hpHtml = `<div class="hp-labels"><span>SL ${fmt(sl)}</span>
          <span>🚀 トレーリング中（利確上限なし）</span></div>`;
      }
      const conv = p.conviction != null
        ? `<span class="tag">AI確信度 <b class="num">${Math.round(p.conviction * 100)}%</b></span>` : "";
      // 長期は手動買付のため、実買付の有無を明示する（紙上のまま含み益を
      // 見せると「持っているつもり」になる。2026-08-01 運用者確認: 全て紙上）
      let manualTag = "";
      if (p.manual) {
        if (p.manual.state === "filled") {
          const div = p.manual.divergence_pct;
          manualTag = `<span class="tag" style="color:var(--pos)">実買付済
            ${div != null ? `<b class="num">乖離${div > 0 ? "+" : ""}${div}%</b>` : ""}</span>`;
        } else if (p.manual.state === "closed") {
          manualTag = `<span class="tag">実売却済</span>`;
        } else {
          manualTag = `<span class="tag" style="opacity:.75">紙上（未買付）</span>`;
        }
      }
      const isReal = p.track === "short" || (p.manual && p.manual.state === "filled");
      h += `<div class="pos-card glass" data-track="${esc(p.track)}"
        data-pnl="${Number(p.pnl_pct) || 0}" data-days="${p.days ?? 0}"
        data-dist="${p.stop_dist_pct ?? 999}" data-code="${esc(p.code)}"
        data-real="${isReal ? 1 : 0}">
        <div class="pos-head">
          <div class="pos-name">${esc(p.name)}<span class="pos-code num">${stockLink(p.code)}</span>${manualTag}</div>
          <div class="pos-pnl num ${cls(p.pnl_pct)}" style="color:var(--${cls(p.pnl_pct)})">
            ${p.pnl_pct >= 0 ? "+" : ""}${Number(p.pnl_pct).toFixed(1)}%</div>
        </div>
        <div class="pos-meta">
          <span class="tag">${TRACK_JA[p.track] || esc(p.track)}</span>
          <span class="tag">${stratDot(p.strategy)}${esc(p.strategy)}</span>
          ${conv}
          ${p.days != null ? `<span class="tag num">${p.days}日目</span>` : ""}
        </div>
        ${hpHtml}
        <div class="pos-nums num">
          <span>取得 ${fmt(p.entry)}円 × ${fmt(p.shares)}株 = ${fmt(p.entry * p.shares)}円</span>
          <span>現在 ${fmt(p.current)}円</span>
          <span class="${cls(p.pnl)}" style="color:var(--${cls(p.pnl)});font-weight:700">${yen(p.pnl)}</span>
        </div>
      </div>`;
    }
    h += `</div>`;
  }

  /* 📲 実約定の記録: LINEの推奨を見て手動口座で買った/売った直後に、
     その場で記録する（GitHub API 経由・初回のみPAT設定）。
     保有ポジションの直後 = 「買ったものを記録する」文脈の位置に置く */
  function fillCard() {
    if (!d.remote_fill || !d.remote_fill.repo) return "";
    const longs = d.positions.filter(p => p.track === "long");
    const opts = longs.map(p =>
      `<option value="${esc(p.code)}" data-shares="${p.shares}" data-entry="${p.entry}">
         ${esc(p.code)} ${esc(p.name)}</option>`).join("")
      + `<option value="">その他（コードを入力）</option>`;
    return `<div class="card glass" id="fillCard"><h2><span class="em">📲</span>実約定の記録（手動口座）</h2>
      <div class="chart-note" style="margin:-6px 0 12px">NISA推奨の銘柄を実際に売買したら、その場でここに記録。
        送信すると1〜2分でLINEに確認が届き、翌朝PCの正本に取り込まれます。</div>
      <div id="rfToken" class="rf-token"></div>
      <div class="rf-grid">
        <label class="rf-lbl">銘柄<select id="rfCode" class="rf-in">${opts}</select></label>
        <label class="rf-lbl" id="rfOtherWrap" style="display:${longs.length ? "none" : "flex"}">コード（4桁）
          <input id="rfCodeOther" class="rf-in" inputmode="numeric" pattern="[0-9]{4}" placeholder="5351"></label>
        <label class="rf-lbl">売買<select id="rfAction" class="rf-in">
          <option value="buy">買付</option><option value="sell">売却</option></select></label>
        <label class="rf-lbl">株数<input id="rfShares" class="rf-in" type="number" min="1" step="1" inputmode="numeric" placeholder="200"></label>
        <label class="rf-lbl">約定単価（円）<input id="rfPrice" class="rf-in" type="number" min="0.1" step="0.1" inputmode="decimal" placeholder="2060"></label>
        <label class="rf-lbl">約定日<input id="rfDate" class="rf-in" type="date"></label>
        <label class="rf-lbl wide">メモ（任意）<input id="rfNote" class="rf-in" maxlength="100" placeholder="例: 寄付で約定"></label>
      </div>
      <button id="rfSend" class="rf-send">記録を送信</button>
      <div id="rfMsg" class="rf-msg" role="status"></div>
    </div>`;
  }
  h += fillCard();

  /* 直近トレード */
  if (d.trades.length) {
    h += `<div class="card glass"><h2><span class="em">🧾</span>直近の決済</h2>`;
    for (const t of d.trades.slice(0, 12)) {
      const win = t.pnl >= 0;
      h += `<div class="trade">
        <div class="w-orb ${win ? "win" : "loss"}">${win ? "W" : "L"}</div>
        <div class="mid">
          <div class="nm">${esc(t.name)} <span class="pos-code num">${stockLink(t.code)}</span></div>
          <div class="dt num">${esc(t.date)} ・ ${EXIT_JA[t.exit_reason] || esc(t.exit_reason || "—")}
            ${t.holding_days != null ? `・${t.holding_days}日` : ""}</div>
        </div>
        <div class="amt num" style="color:var(--${cls(t.pnl)})">${yen(t.pnl)}
          <span class="p">${t.pnl_pct >= 0 ? "+" : ""}${Number(t.pnl_pct).toFixed(2)}%</span></div>
      </div>`;
    }
    h += `</div>`;
  }

  /* AI Bull vs Bear */
  if (d.ai_stories.length) {
    h += `<div class="card glass"><h2><span class="em">🤖</span>AI ディベート（強気 vs 弱気）</h2>`;
    for (const s of d.ai_stories) {
      const vc = s.verdict === "veto" ? "v-veto" : s.verdict === "reduce" ? "v-reduce" : "v-proceed";
      const vt = s.verdict === "veto" ? "見送り" : s.verdict === "reduce" ? "縮小" : "GO";
      let outcome = "";
      if (s.outcome) {
        outcome = `<div class="duel-outcome" style="color:var(--${s.outcome.win ? "pos" : "neg"})">
          結果: ${s.outcome.win ? "✅ 勝ち" : "❌ 負け"}
          ${s.outcome.pnl_pct != null ? `(${s.outcome.pnl_pct >= 0 ? "+" : ""}${Number(s.outcome.pnl_pct).toFixed(1)}%)` : ""}</div>`;
      }
      h += `<div class="duel">
        <div class="duel-head"><span>${esc(s.name)} <span class="pos-code num">${stockLink(s.code)}</span></span>
          <span class="verdict ${vc}">${vt}</span></div>
        <div class="duel-body">
          <div class="side bull"><div class="s-tag">🐂 強気</div>${esc(s.bull) || "—"}</div>
          <div class="side bear"><div class="s-tag">🐻 弱気</div>${esc(s.bear) || "—"}</div>
        </div>${outcome}</div>`;
    }
    h += `</div>`;
  }

  /* AI較正 */
  if (d.calibration.length) {
    h += `<div class="card glass"><h2><span class="em">🎓</span>AI較正（確信度の答え合わせ）</h2><div class="cal-list">`;
    for (const c of d.calibration) {
      h += `<div class="cal-row">
        <span class="cal-lbl">${esc(c.label)}</span>
        <div class="cal-bar"><div class="cal-fill" style="width:0" data-w="${c.win_rate}%"></div></div>
        <span class="cal-side num">勝率${c.win_rate}%・${c.n}件</span>
      </div>`;
    }
    h += `</div><div class="chart-note">AIの確信度が実際の勝率と一致しているかの検証。乖離すると自動でサイズ縮小されます。</div></div>`;
  }

  /* G1移行ゲート達成度（評価プロトコル§1）。判断セクション（先頭）から呼ばれる */
  function g1Card() {
    if (!d.g1_gate || !d.g1_gate.checks) return "";
    const g = d.g1_gate;
    let h = `<div class="card glass"><h2><span class="em">🚦</span>G1移行ゲート ${g.passed}/${g.total} 達成</h2><div class="cal-list">`;
    for (const c of g.checks) {
      const v = (c.value === null || c.value === undefined) ? "—" : c.value;
      const pct = Math.round((c.progress || 0) * 100);
      h += `<div class="cal-row">
        <span class="cal-lbl">${c.ok ? "✅" : "⏳"} ${esc(c.label)}</span>
        <div class="cal-bar"><div class="cal-fill" style="width:0" data-w="${pct}%"></div></div>
        <span class="cal-side num">${esc(String(v))} / ${esc(c.target)}</span>
      </div>`;
    }
    h += `</div>`;
    const e = g.eta || {};
    if (e.date) {
      h += `<div class="eta-line">🗓️ このペースだと G1 到達は <b class="num">${esc(e.date)}</b> ごろ
        <span class="eta-sub">（${esc(e.basis)} ・ 週${e.rate_per_week}件 ・ 残り${30 - (g.checks[0].value || 0)}件）</span></div>`;
    } else if (e.unknown) {
      h += `<div class="eta-line muted">🗓️ G1到達見込み: ${esc(e.unknown)}</div>`;
    }
    h += `<div class="chart-note">${esc(g.note)} 全達成で1〜5万円の実弾検証（G1）へ。詳細は EVALUATION_PROTOCOL.md / G1_CHECKLIST.md</div></div>`;
    return h;
  }


  /* NISA枠（年間＋生涯） */
  if (d.nisa && d.nisa.limit > 0) {
    const used = d.nisa.used || 0;
    const pct = Math.min(used / d.nisa.limit * 100, 100);
    const lused = d.nisa.lifetime_used || 0;
    const llim = d.nisa.lifetime_limit || 0;
    const lpct = llim > 0 ? Math.min(lused / llim * 100, 100) : 0;
    h += `<div class="card glass"><h2><span class="em">🌱</span>NISA成長投資枠</h2>
      <div class="nisa-lbl num">年間 ${esc(d.nisa.year)}</div>
      <div class="nisa-bar"><div class="nisa-fill" data-w="${pct.toFixed(1)}%"></div></div>
      <div class="nisa-cap num"><span>推奨累計 ${fmt(used)}円</span>
        <span>残り ${fmt(Math.max(d.nisa.limit - used, 0))}円</span></div>
      <div class="chart-note" style="margin-top:6px">${
        (d.nisa.real_used || 0) > 0
          ? `実買付済み: <b class="num">${fmt(Math.round(d.nisa.real_used))}円</b>（手動記録ベース）`
          : "実買付の記録なし — 上記は推奨ベースの数字で、現時点の保有は全て紙上です"
      }${
        (d.nisa.overflow || 0) > 0
          ? `<br>枠超過の推奨: <b class="num">${fmt(Math.round(d.nisa.overflow))}円</b>（NISA枠外 — 買うなら課税口座）`
          : ""
      }</div>`;
    if (llim > 0) {
      h += `<div class="nisa-lbl num" style="margin-top:12px">生涯枠（簿価・成長枠）</div>
        <div class="nisa-bar"><div class="nisa-fill" data-w="${lpct.toFixed(1)}%"
          style="background:linear-gradient(90deg,var(--accent2),var(--accent))"></div></div>
        <div class="nisa-cap num"><span>使用 ${fmt(lused)}円</span>
          <span>残り ${fmt(Math.max(llim - lused, 0))}円</span></div>`;
    }
    h += `</div>`;
  }

  h += `<div class="foot">
    生成 ${esc(d.generated_at)} ・ このページは AES-256-GCM 暗号文のみを含み、
    復号は端末内で行われます<br>投資判断は自己責任で。Epitaph は助言ではありません。
  </div>`;

  app.innerHTML = h;
  wireFillForm(d);

  /* ゲート退場 → アプリ入場 */
  const gate = document.getElementById("gate");
  document.getElementById("gateCard").classList.add("away");
  setTimeout(() => {
    gate.style.display = "none";
    app.style.display = "block";
    document.getElementById("guideFab").classList.add("show");
    requestAnimationFrame(() => app.classList.add("in"));

    countUp(document.getElementById("heroNum"), total, 1300);
    /* リング・バーのアニメ発火 */
    for (const el of document.querySelectorAll("[data-off]"))
      requestAnimationFrame(() => el.style.strokeDashoffset = el.dataset.off);
    for (const el of document.querySelectorAll("[data-w]"))
      requestAnimationFrame(() => el.style.width = el.dataset.w);

    if (newATH) {
      document.getElementById("athBadge").style.display = "block";
      setTimeout(confetti, 500);
    }
    drawCharts(d);
    initPosTools();
  }, 420);
}

/* ---------- 📲 実約定の記録（GitHub workflow_dispatch 送信） ---------- */
const PAT_KEY = "epitaph_gh_pat";

function wireFillForm(d) {
  const card = document.getElementById("fillCard");
  if (!card) return;
  const $ = (id) => document.getElementById(id);

  /* PAT（Fine-grained・epitaphリポジトリのActions権限のみ）はこの端末の
     localStorage にだけ保存される。ページには埋め込まれない。 */
  function renderToken() {
    const saved = !!localStorage.getItem(PAT_KEY);
    $("rfToken").innerHTML = saved
      ? `<div class="rf-tok-ok">🔑 GitHub接続: 設定済み（この端末）
           <button id="rfTokChange" class="rf-tok-btn" type="button">変更</button></div>`
      : `<div class="rf-tok-setup">
           <div>初回のみ: GitHubの <b>Fine-grained PAT</b>（対象リポジトリ epitaph のみ・
             権限は <b>Actions: Read and write</b> だけ）を作成し、ここに貼り付けて保存して
             ください。トークンは<b>この端末にのみ</b>保存されます。作成手順は
             リポジトリの docs/DASHBOARD.md にあります。</div>
           <input id="rfTokIn" class="rf-in" type="password" autocomplete="off"
                  placeholder="github_pat_...">
           <button id="rfTokSave" class="rf-tok-btn" type="button">この端末に保存</button>
         </div>`;
    const save = $("rfTokSave");
    if (save) save.addEventListener("click", () => {
      const v = $("rfTokIn").value.trim();
      if (!v) return;
      localStorage.setItem(PAT_KEY, v);
      renderToken();
    });
    const chg = $("rfTokChange");
    if (chg) chg.addEventListener("click", () => {
      localStorage.removeItem(PAT_KEY);
      renderToken();
    });
  }
  renderToken();

  /* 約定日の既定は端末ローカルの今日（sv-SE ロケール = YYYY-MM-DD 表記） */
  $("rfDate").value = new Date().toLocaleDateString("sv-SE");

  /* 銘柄を選ぶと紙上の株数・建値をプレースホルダに反映（入力の手間を削る） */
  function onCodeChange() {
    const sel = $("rfCode");
    const opt = sel.selectedOptions[0];
    $("rfOtherWrap").style.display = sel.value ? "none" : "flex";
    if (opt && opt.dataset.shares) {
      $("rfShares").placeholder = opt.dataset.shares;
      if (!$("rfShares").value) $("rfShares").value = opt.dataset.shares;
      $("rfPrice").placeholder = opt.dataset.entry;
    }
  }
  $("rfCode").addEventListener("change", onCodeChange);
  onCodeChange();

  function show(text, isErr) {
    const m = $("rfMsg");
    m.textContent = text;
    m.className = "rf-msg " + (isErr ? "err" : "ok");
  }

  async function send() {
    const code = ($("rfCode").value || $("rfCodeOther").value).trim();
    const action = $("rfAction").value;
    const shares = $("rfShares").value.trim();
    const price = $("rfPrice").value.trim();
    const date = $("rfDate").value;
    if (!/^[0-9]{4}$/.test(code)) return show("銘柄コードは4桁の数字で入力してください", true);
    if (!(parseInt(shares, 10) > 0)) return show("株数を入力してください", true);
    if (!(parseFloat(price) > 0)) return show("約定単価を入力してください", true);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return show("約定日を選択してください", true);
    const pat = localStorage.getItem(PAT_KEY);
    if (!pat) return show("先に上の「GitHub接続」を設定してください", true);

    const btn = $("rfSend");
    btn.disabled = true;                       /* 二度押し防止（第一の砦） */
    const prev = btn.textContent;
    btn.textContent = "送信中…";
    try {
      const url = `https://api.github.com/repos/${d.remote_fill.repo}` +
                  `/actions/workflows/${d.remote_fill.workflow}/dispatches`;
      const r = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + pat,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ ref: "main", inputs: {
          code, action, shares, price, fill_date: date,
          note: $("rfNote").value.trim(),
          /* サーバ側の二重記録防止に使う送信ID（第二の砦） */
          submission_id: crypto.randomUUID(),
        }}),
      });
      if (r.status === 204) {
        show(`✅ 送信しました: ${code} ${action === "buy" ? "買付" : "売却"} ` +
             `${shares}株 @${price}円 — 1〜2分でLINEに確認が届きます。` +
             `届かなければ再送信してください。`);
        $("rfNote").value = "";
      } else if (r.status === 401) {
        show("❌ トークンが無効です（期限切れの可能性）。「変更」から再設定してください", true);
      } else if (r.status === 403 || r.status === 404) {
        show("❌ トークンの権限が足りません。Fine-grained PATで epitaph リポジトリ + " +
             "Actions: Read and write を許可してください", true);
      } else {
        show(`❌ 送信に失敗しました（HTTP ${r.status}）— 時間を置いて再送信してください`, true);
      }
    } catch (e) {
      show("❌ 通信エラー — 電波状況を確認して再送信してください", true);
    } finally {
      btn.disabled = false;
      btn.textContent = prev;
    }
  }
  $("rfSend").addEventListener("click", send);
}

/* ---------- Chart.js ---------- */
let charts = [];
/* 保有ポジションの並べ替え・絞り込み。既存DOMノードを並べ替え/表示切替する
   だけで再描画しない（テンプレート再構築より壊れにくい）。 */
function initPosTools() {
  const list = document.getElementById("posList");
  const sortSel = document.getElementById("posSort");
  if (!list || !sortSel) return;

  const KEYS = {
    dist:    { attr: "dist", dir: 1 },   // ストップに近い順（要注意が上）
    pnldesc: { attr: "pnl",  dir: -1 },
    pnlasc:  { attr: "pnl",  dir: 1 },
    days:    { attr: "days", dir: -1 },
    code:    { attr: "code", dir: 1 },
  };
  const applySort = () => {
    const k = KEYS[sortSel.value] || KEYS.dist;
    const cards = Array.from(list.children);
    cards.sort((a, b) => {
      const av = a.dataset[k.attr], bv = b.dataset[k.attr];
      const an = parseFloat(av), bn = parseFloat(bv);
      const cmp = (isNaN(an) || isNaN(bn))
        ? String(av).localeCompare(String(bv)) : an - bn;
      return cmp * k.dir;
    });
    for (const c of cards) list.appendChild(c);
  };
  sortSel.addEventListener("change", applySort);

  let filter = "all";
  const applyFilter = () => {
    for (const c of list.children) {
      const ds = c.dataset;
      let show = true;
      if (filter === "short" || filter === "long") show = ds.track === filter;
      else if (filter === "loss") show = parseFloat(ds.pnl) < 0;
      else if (filter === "real") show = ds.real === "1";
      c.style.display = show ? "" : "none";
    }
  };
  for (const btn of document.querySelectorAll(".pchip")) {
    btn.addEventListener("click", () => {
      filter = btn.dataset.pf;
      for (const b of document.querySelectorAll(".pchip"))
        b.classList.toggle("on", b === btn);
      applyFilter();
    });
  }
  applySort();   // 既定: ストップまで近い順（最も注意が要る玉が上）
}

function drawCharts(d) {
  if (typeof Chart === "undefined") return;
  for (const c of charts) c.destroy();
  charts = [];
  const dark = isDark();
  const gridC = dark ? "rgba(255,255,255,.07)" : "rgba(30,45,90,.08)";
  const tickC = dark ? "#9AA5BC" : "#5A6478";
  const accent = dark ? "#2E7FE8" : "#1D63C7";
  const pos = dark ? "#3DD68C" : "#177A4C";
  const neg = dark ? "#FF6B6B" : "#C43D3D";
  Chart.defaults.font.family = "-apple-system, 'Hiragino Sans', Meiryo, sans-serif";

  const pnlBar = (elId, rows, labelOf) => {
    const el = document.getElementById(elId);
    if (!el || !rows || !rows.length) return;
    charts.push(new Chart(el, {
      type: "bar",
      data: { labels: rows.map(labelOf),
        datasets: [{ data: rows.map(x => x.pnl),
          backgroundColor: rows.map(x => x.pnl >= 0 ? pos : neg),
          borderRadius: 6, maxBarThickness: 34 }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: c => " " + yen(c.parsed.y) } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: tickC } },
          y: { grid: { color: gridC }, border: { display: false },
               ticks: { color: tickC, maxTicksLimit: 5, callback: v => fmt(v) } } } }
    }));
  };
  pnlBar("dailyChart", d.daily, x => x.date.slice(5).replace("-", "/"));
  pnlBar("weeklyChart", d.weekly, x => x.week.slice(5).replace("-", "/") + "週");


  const mo = document.getElementById("monthlyChart");
  if (mo && d.monthly.length) {
    charts.push(new Chart(mo, {
      type: "bar",
      data: { labels: d.monthly.map(x => x.month),
        datasets: [{ label: "月次実現損益", data: d.monthly.map(x => x.pnl),
          backgroundColor: d.monthly.map(x => x.pnl >= 0 ? pos : neg),
          borderRadius: 6, maxBarThickness: 34 }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: c => " " + yen(c.parsed.y) } } },
        scales: {
          x: { grid: { display: false }, ticks: { color: tickC } },
          y: { grid: { color: gridC }, border: { display: false },
               ticks: { color: tickC, maxTicksLimit: 5, callback: v => fmt(v) } } } }
    }));
  }
}

/* テーマ切替でチャート色を追従 */
let lastData = null;
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => {
  if (lastData) drawCharts(lastData);
});

/* ---------- 解錠 ---------- */
async function unlock() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  const card = document.getElementById("gateCard");
  if (!pw) return;
  err.textContent = "復号中…";
  let data;
  try {
    data = await decrypt(pw);
  } catch (e) {
    err.textContent = "パスワードが違います";
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
    return;
  }
  err.textContent = "";
  lastData = data;
  try {
    render(data);
  } catch (e) {
    /* 描画のバグを「パスワードが違います」に化かさない（2026-08-12に
       実際に起き、正しいパスワードが拒否されたように見えた） */
    err.textContent = "表示エラー: " + (e && e.message ? e.message : e);
    throw e;
  }
}
document.getElementById("unlock").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", (e) => {
  if (e.key === "Enter") unlock();
});
